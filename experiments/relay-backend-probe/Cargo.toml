[package]
name = "relay-backend-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately isolated: this experiment does not upgrade MDK's SDK dependency.
[workspace]

[dependencies]
nostr-sdk = { git = "https://github.com/erskingardner/rust-nostr", rev = "26a42e043474860fb0b0dbc1eb4ab34bc2c661fb", features = ["local-relay"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
tokio-tungstenite = "0.26"
serde_json = "1"
cgka-traits = { path = "../../crates/traits" }
transport-nostr-adapter = { path = "../../crates/transport-nostr-adapter" }
transport-nostr-peeler = { path = "../../crates/transport-nostr-peeler" }
async-trait = "0.1"
hex = "0.4"
