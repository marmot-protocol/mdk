# nextest configuration.
#
# The `wn-cli::cli` integration tests behave like mini end-to-end
# systems: each one spawns `wn` subprocesses, a `wnd` daemon, local relays, QUIC
# brokers, and account/runtime workers, then drives polling loops. nextest runs
# every test in its own process at per-CPU parallelism, so under load the heavy
# per-test setup is multiplied across the box and worker/daemon startup is
# starved, surfacing as `account worker startup timed out` flakes (issue #103).
#
# Two layers keep that suite from starving the rest of the workspace:
#   1. The `cli-e2e` test-group caps its concurrency (below), so local `just
#      test` runs stay sane.
#   2. CI runs this binary in its own dedicated job (`.github/workflows/ci.yml`,
#      job `cli-e2e`) instead of inside the partitioned unit matrix, so the
#      subprocess fan-out never competes for cores with the fast unit tests.
# The serial `marmot-app::relay_runtime` suite stays on its own
# `cargo test --test-threads=1` job (PR #100) and is unaffected by this.

[profile.default]
# The multi-threaded conformance chaos tests spin up a worker pool that can take
# longer than nextest's 100 ms default to wind down once the box is CPU-bound,
# which surfaces as a spurious "leaky" label even though the test passed and the
# threads do exit. A larger budget avoids the false positive without hiding a
# genuinely leaked subprocess (those persist indefinitely, far past this window).
leak-timeout = "500ms"

[test-groups]
# Reduced concurrency for the subprocess-heavy CLI end-to-end tests. Tunable: 1
# fully serializes them, higher trades isolation for wall-clock.
cli-e2e = { max-threads = 2 }
# Each process-orchestrator test starts multiple application nodes and local
# relays. Running those tests against each other can starve relay publication
# admission long enough to trip the action-correlation timeout even though the
# same scenario is stable in isolation.
process-orchestrator = { max-threads = 1 }
# Every public app journey starts a local relay and several SQLCipher runtimes
# and then waits on real settlement windows. Two at a time keeps the smoke lane
# moving without letting eleven of them starve each other's relay admission.
app-runtime-journeys = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'package(wn-cli) & binary(cli)'
test-group = 'cli-e2e'

[[profile.default.overrides]]
filter = 'package(cgka-conformance-simulator) & binary(process_orchestrator)'
test-group = 'process-orchestrator'

[[profile.default.overrides]]
filter = 'package(cgka-conformance-simulator) & (binary(app_runtime_journeys) | binary(app_runtime_interaction_journeys))'
test-group = 'app-runtime-journeys'

# These cross-process recovery cases each launch several runtimes and local
# relays. Reserve the full nextest worker budget so CPU pressure cannot turn a
# stable-checkpoint deadline into a convergence failure.
[[profile.default.overrides]]
filter = 'binary(process_orchestrator) & (test(=app_runtime_and_process_adapters_recover_the_same_offline_projection) | test(=four_party_cross_route_recovery_processes_match_unified_route) | test(=four_party_cross_route_recovery_app_runtime_matches_unified_route))'
threads-required = "num-cpus"
priority = 90

# CI profile (`cargo nextest run --profile ci`).
#
# Retries are a safety net for transient infrastructure hiccups (mock-relay bind
# races, momentary worker-startup starvation). They do NOT replace the dedicated
# `cli-e2e` job, which is the real fix for the starvation flake (issue #103): a
# retried-then-passed test is reported as FLAKY, so masking still surfaces.
[profile.ci]
retries = 1
# Keep the SLOW marker informative at 60s. No global `terminate-after`: the
# conformance simulator chaos suites legitimately run for several minutes.
slow-timeout = { period = "60s" }

# The subprocess-heavy CLI e2e suite is the one that starves under load. Give it
# a couple of retries and a generous hung-test backstop so a wedged subprocess
# wait is killed and retried instead of burning the whole job's 30-minute budget.
[[profile.ci.overrides]]
filter = 'package(wn-cli) & binary(cli)'
retries = 2
slow-timeout = { period = "60s", terminate-after = 4 }

# PRs keep ordinary unit/regression tests and representative public journeys.
# Exhaustive matrices and large scale fixtures remain in ci-full. Editing Rust
# test sources selects ci-full for the affected packages, so those regressions
# are never deferred on the PR that changes them. Keep `ci` unchanged for the
# existing nightly/weekly callers (including older nextest versions).
[profile.ci-pr]
retries = 1
slow-timeout = { period = "60s" }
default-filter = '''
not (
    test(=capability_matrix_36_cells)
    | test(=tests::thirty_incremental_invites_with_large_directory_cache_converge_without_false_success)
    | test(=chat_list::pages::tests::account_attention_adds_invites_without_changing_unread_list_or_mute_policy)
    | test(=chat_list::pages::tests::ready_window_sql_work_is_bounded_across_account_and_history_sizes)
    | test(=client::sync::projection_retry_tests::resumed_publication_wakes_after_revival_and_checkpoint)
    | test(=current_founding_welcomes_publish_with_bounded_concurrency)
    | test(=timeline::tests::many_reactions_retract_across_bind_parameter_chunk_boundary)
    | test(=media::tests::encrypted_media_round_trip_crosses_the_previous_64_mib_limit)
    | test(=current_natural_overflow_history_control_delivers_every_retained_message)
    | test(=current_reverse_overflow_history_delivers_every_retained_message)
)
and (not (package(=wn-cli) & binary(=cli)) or (
    test(=whitenoise_command_surface_names_are_present)
    | test(=account_create_list_and_status_are_json_addressable)
    | test(=local_group_message_workflow_runs_through_the_dm_contract)
    | test(=daemon_start_status_execute_and_stop_are_user_facing_commands)
    | test(=messages_edit_publishes_replacement_and_enforces_local_authorship)
    | test(=real_local_relays_deliver_cli_messages_over_sdk_path)
))
and (not (package(=marmot-app) & binary(=relay_runtime)) or (
    test(=relay_app_runtime_reopens_account_state)
    | test(=app_runtime_executes_group_and_message_intents_on_managed_accounts)
    | test(=app_runtime_chat_and_group_state_subscriptions_stream_projection_updates)
    | test(=confirmed_invite_welcome_resumes_after_restart)
    | test(=pending_leave_request_survives_a_cold_launch)
    | test(=app_runtime_sign_out_reports_deletion_failure_and_keeps_local_state)
    | test(=create_group_returns_before_blocked_founding_welcome)
    | test(=tagged_upload_and_text_reach_peer)
))
'''

[[profile.ci-pr.overrides]]
filter = 'package(wn-cli) & binary(cli)'
retries = 2
slow-timeout = { period = "60s", terminate-after = 4 }

# Explicit all-test profile for master, merge groups, manual runs and ci:full.
# Ignored tests remain opt-in, just as in the existing ci profile.
[profile.ci-full]
retries = 1
slow-timeout = { period = "60s" }
default-filter = "all()"

[[profile.ci-full.overrides]]
filter = 'package(wn-cli) & binary(cli)'
retries = 2
slow-timeout = { period = "60s", terminate-after = 4 }
