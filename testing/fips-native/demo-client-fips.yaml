node:
  identity:
    # Generate fips.key/fips.pub beside this file on first start and reuse them.
    persistent: true
  leaf_only: true
  log_level: info
  control:
    enabled: true
    socket_path: /run/fips/control.sock
  native_api:
    enabled: true
    socket_path: /run/fips/api.sock
    pending_per_flow: 64
    debug_commands: false

tun:
  enabled: false

dns:
  enabled: false

transports:
  udp:
    bind_addr: "0.0.0.0:2121"
    mtu: 1280

peers:
  - npub: npub1pq5w2qtanuqfu6xctrqvz6jz5adwa0qyr3wvkfw2xy6yv7fneytq49daxg
    alias: wok-relay
    addresses:
      - transport: udp
        addr: "62.238.50.254:2121"
        priority: 1
      - transport: udp
        addr: "[2a01:4f9:c015:b7a::1]:2121"
        priority: 2
    connect_policy: auto_connect
    auto_reconnect: true
