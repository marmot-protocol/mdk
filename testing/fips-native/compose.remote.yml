name: mdk-fips-remote

x-runtime-image: &runtime-image
  build:
    context: ../..
    dockerfile: testing/fips-native/Dockerfile
    network: host
    args:
      FIPS_GIT_REV: 1ec62e51192a3ed49792e177c8c88d8176647133
      WOK_GIT_REV: 957d22c296e8053c7d01c80f15a3ae9b2b5f2fca
  image: mdk-fips-e2e:local

services:
  discovery:
    <<: *runtime-image
    profiles: [mdk]
    command: ["wok", "--config", "/etc/wok/discovery-wok.toml", "relay"]
    init: true
    volumes:
      - discovery-data:/var/lib/wok-discovery
    networks: [fips-client]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:7778/"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  client-fips:
    <<: *runtime-image
    command: ["fips", "--config", "/etc/fips/remote-client-fips.yaml"]
    init: true
    volumes:
      - client-fips-run:/run/fips
    networks: [fips-client]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          fipsctl --socket /run/fips/control.sock show peers |
          grep -Fq npub1pq5w2qtanuqfu6xctrqvz6jz5adwa0qyr3wvkfw2xy6yv7fneytq49daxg
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  mdk-e2e:
    <<: *runtime-image
    build:
      context: ../..
      dockerfile: testing/fips-native/Dockerfile.e2e
      network: host
    image: mdk-fips-cli-e2e:local
    profiles: [mdk]
    entrypoint: ["/usr/local/bin/mdk-fips-cli-e2e"]
    depends_on:
      discovery:
        condition: service_healthy
      client-fips:
        condition: service_healthy
    network_mode: service:discovery
    volumes:
      - client-fips-run:/run/fips
      - mdk-alice-data:/var/lib/mdk/alice
      - mdk-bob-data:/var/lib/mdk/bob

  smoke:
    <<: *runtime-image
    entrypoint:
      - /usr/local/bin/mdk-fips-relay-smoke
      - /run/fips/api.sock
      - fips://npub1pq5w2qtanuqfu6xctrqvz6jz5adwa0qyr3wvkfw2xy6yv7fneytq49daxg
      - ${FIPS_REMOTE_SMOKE_MODE:---read-only}
      - --websocket
      - wss://relay.fips.whitenoise.chat
    depends_on:
      client-fips:
        condition: service_healthy
    volumes:
      - client-fips-run:/run/fips
    networks: [fips-client]

networks:
  fips-client:
    driver: bridge

volumes:
  client-fips-run:
  discovery-data:
  mdk-alice-data:
  mdk-bob-data:
