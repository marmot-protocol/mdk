manifest_version: 1
name: marmot
version: 0.1.0
description: Marmot group-chat platform adapter backed by the local wn-agent control socket
author: marmot-protocol
license: MIT
homepage: https://github.com/marmot-protocol/mdk/tree/master/integrations/hermes/marmot
tags:
  - marmot
  - nostr
  - messaging
  - privacy
entry_point: adapter:register
api_version: 1
config_schema:
  socket_path:
    type: string
    default: ~/.local/share/whitenoise/agent-control.sock
    description: Unix socket exposed by wn-agent serve --enable-agent-control
  account:
    type: string
    default: ""
    description: Optional exact account pubkey; empty requires exactly one local account
  group_id:
    type: string
    default: ""
    description: Optional Marmot home group ID
  download_dir:
    type: string
    default: ~/.hermes/marmot-downloads
    description: Sandboxed directory for inbound media downloads
  media_staging_dir:
    type: string
    default: ~/.hermes/marmot-media-outbox
    description: Sandboxed directory for outbound media staging
  register_tools:
    type: boolean
    default: false
    description: Register explicit Marmot history, reaction, and delete tools
  reaction_tools_allowed:
    type: boolean
    default: false
    description: Allow durable reaction writes when register_tools is enabled
  delete_tool_allowed:
    type: boolean
    default: false
    description: Allow durable message deletion when register_tools is enabled
  recipient_public_keys:
    type: string
    default: ""
    description: Optional comma-separated gift-wrap recipient pubkeys for direct replies
  public_read_relays:
    type: string
    default: ""
    description: Optional comma-separated public Nostr read relays
  media_servers:
    type: string
    default: ""
    description: Optional comma-separated Blossom upload servers
  auto_streaming_mode:
    type: string
    default: off
    description: Streaming reply mode (off, progress_only, draft, chunked)
  lost_stream_policy:
    type: string
    default: resume
    description: Lost-stream recovery policy (resume or finalize_recovery)
  allow_private_live_streaming:
    type: boolean
    default: false
    description: Permit partial live-stream publication for private Marmot messages
  welcome_enabled:
    type: boolean
    default: false
    description: Enable exact-membership group welcome replies
  welcome_message:
    type: string
    default: ""
    description: Welcome text published for newly joined groups
  welcome_allowlist:
    type: string
    default: ""
    description: Optional comma-separated group IDs eligible for welcomes
  welcome_recipients:
    type: string
    default: ""
    description: Optional comma-separated welcome recipient pubkeys
  welcome_media_files:
    type: string
    default: ""
    description: Optional comma-separated welcome attachment paths
  welcome_media_alt:
    type: string
    default: ""
    description: Alt text used for configured welcome media
  welcome_update_name:
    type: string
    default: ""
    description: Optional group name update applied after joining
  welcome_update_description:
    type: string
    default: ""
    description: Optional group description update applied after joining
  welcome_update_admins:
    type: string
    default: ""
    description: Optional comma-separated admin pubkeys applied after joining
hermes:
  minimum_version: 0.19.0
  floor_source_ref: 7b9a9e7783d24b62a36c27de9c00ee25339f3b4a
  current_source_ref: 7166071fcaadb36df26f6d753dda97da6b5d699e
  outbound_media_api_candidate_ref: 672367f44245a8b4e5e0233eae0b205d409e4286
companion:
  binary: wn-agent
  minimum_version: 0.9.18
media:
  inbound:
    - image
    - document
    - video
    - voice
  outbound:
    - image
    - document
    - video
    - voice
  host_dispatch: feature-detected
