manifest_version: 1
name: marmot
label: Marmot
kind: platform
version: 0.1.0
description: Marmot group-chat platform adapter backed by the local wn-agent control socket
author: marmot-protocol
requires_env: []
optional_env:
  - name: MARMOT_HOME
    description: "wn-agent home directory; required unless MARMOT_AGENT_SOCKET is set"
    password: false
  - name: MARMOT_AGENT_SOCKET
    description: "Unix socket for wn-agent; defaults to $MARMOT_HOME/dev/wn-agent.sock"
    password: false
  - name: MARMOT_AGENT_AUTH_TOKEN
    description: "Bearer token for a token-gated wn-agent control socket"
    password: true
  - name: MARMOT_AGENT_AUTH_TOKEN_FILE
    description: "Path to a bearer token file for a token-gated wn-agent control socket"
    password: false
  - name: MARMOT_ACCOUNT_ID_HEX
    description: "Agent account pubkey/account id hex; required when wn-agent has more than one account"
    password: false
  - name: MARMOT_GROUP_ID_HEX
    description: "Optional Marmot group id filter for inbound messages"
    password: false
  - name: MARMOT_QUIC_CANDIDATES
    description: "Comma-separated quic:// preview broker candidates for live Marmot previews"
    password: false
  - name: MARMOT_HOME_CHANNEL
    description: "Default Marmot group id for Hermes cron/home delivery"
    password: false
  - name: MARMOT_DEBOUNCE_MS
    description: "Optional inbound debounce window in ms; coalesces rapid same-sender/group messages into one turn (0 or absent = disabled)"
    password: false
  - name: MARMOT_GROUP_ACTIVATION
    description: "Multi-party group reply policy: mention (default) or always"
    password: false
  - name: MARMOT_MENTION_PATTERNS
    description: "Comma-separated trigger phrases; the configured agent name is always included when set"
    password: false
  - name: MARMOT_AGENT_NAME
    description: "Agent display name used as an extra mention trigger in multi-party groups and as the default Nostr profile name during onboarding"
    password: false
  - name: MARMOT_WELCOMER_ALLOWLIST
    description: "Comma-separated hex account ids mirrored into wn-agent's welcomer allowlist on connect (also MARMOT_DM_ALLOW_FROM)"
    password: false
  - name: MARMOT_ALLOWED_USERS
    description: "Comma-separated hex Marmot account ids allowed to message Hermes; loaded from $HERMES_HOME/.env at gateway startup"
    password: false
  - name: MARMOT_ALLOW_ALL_USERS
    description: "When true, accept Marmot messages from any sender; loaded from $HERMES_HOME/.env at gateway startup"
    password: false
  - name: MARMOT_MEDIA_LOCAL_ROOTS
    description: "Comma-separated local directories allowed for outbound media sends; defaults to $MARMOT_HOME/dev/inbound-media"
    password: false
  - name: MARMOT_INBOUND_MEDIA_DIR
    description: "Directory where inbound media is re-staged before agent tools read it; defaults to $MARMOT_HOME/dev/inbound-media"
    password: false
  - name: MARMOT_OUTBOUND_MEDIA_DIR
    description: "Connector-approved directory for short-lived outbound media staging; defaults to $MARMOT_HOME/dev/outbound-media"
    password: false
  - name: MARMOT_PROFILE_NAME_ONBOARDING
    description: "Enable the one-time public Nostr profile-name consent flow (true/false)"
    password: false
  - name: MARMOT_PROFILE_ONBOARDING_STATE
    description: "Path to the profile onboarding state file; defaults to $MARMOT_HOME/dev/profile-onboarding.json"
    password: false
license: MIT
homepage: https://github.com/marmot-protocol/mdk/tree/master/integrations/hermes/marmot
tags:
  - marmot
  - nostr
  - messaging
  - privacy
api_version: 1
config_schema:
  socket_path:
    type: string
    default: ~/.local/share/whitenoise/agent-control.sock
    description: Unix socket exposed by wn-agent serve --enable-agent-control
  home:
    type: string
    default: ""
    description: wn-agent home directory used to derive the default control socket
  account_id_hex:
    type: string
    default: ""
    description: Optional exact account pubkey; empty requires exactly one local signing account
  group_id_hex:
    type: string
    default: ""
    description: Optional Marmot home group ID
  home_channel:
    type: string
    default: ""
    description: Default Marmot group ID for Hermes home and cron delivery
hermes:
  minimum_version: 0.19.0
  floor_source_ref: 3ef6bbd201263d354fd83ec55b3c306ded2eb72a
  current_source_ref: 7166071fcaadb36df26f6d753dda97da6b5d699e
  outbound_media_api_candidate_ref: 672f2493502b6ed7d5d0c9f520bfb9c2f6ee39bc
companion:
  binary: wn-agent
  minimum_version: 0.9.18
media:
  inbound:
    - image
    - document
    - video
    - voice
  outbound:
    - image
    - document
    - video
    - voice
  host_dispatch: feature-detected
