name: Startup scaling benchmarks

# On-demand only (mdk#1161): the full matrix builds 1000-group stores and is
# far too slow for per-PR CI. The small smoke case runs in the normal test
# suite; this job produces the full `MDK_BENCH ...` report for before/after
# comparisons on hydration changes.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  startup-bench:
    name: Startup scaling benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install just
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # just
        with:
          tool: just

      - name: Run startup scaling benchmarks
        run: just bench-startup | tee startup-bench.log

      - name: Summarize
        run: |
          set -euo pipefail
          {
            echo '### Startup scaling benchmarks'
            echo '```'
            grep '^MDK_BENCH ' startup-bench.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: startup-bench-log
          path: startup-bench.log
