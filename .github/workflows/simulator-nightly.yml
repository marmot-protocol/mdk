name: Simulator Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      recovery_only:
        description: Run only the production-policy 1024-message recovery journeys
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CGKA_LANE_EVIDENCE_DIR: ${{ github.workspace }}/target/cgka-nightly-lane-evidence

jobs:
  simulator-nightly:
    name: Full simulator, campaigns, and vectors
    if: ${{ !inputs.recovery_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.104

      - name: Install just
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: just

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Prepare private evidence roots
        run: |
          install -d -m 700 \
            "$CGKA_LANE_EVIDENCE_DIR/steps" \
            target/cgka-adversarial-reliability-ci \
            target/cgka-conformance-simulator-nightly-reports \
            target/cgka-distributed-container-evidence

      - name: Run nightly convergence lane
        id: convergence_lane
        continue-on-error: true
        run: |
          # SQLCipher deliberately locks sensitive allocations. Give the test
          # process enough memlock headroom so the runner does not amplify one
          # warning per allocation when its inherited limit is exhausted.
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          cargo run -p convergence-campaign-runner --bin cgka-distributed-campaign --locked -- \
            observe-step \
            --name nightly-core \
            --output "$CGKA_LANE_EVIDENCE_DIR/steps/nightly-core.json" \
            -- just convergence-nightly-lane

      - name: Capture failed adversarial scenarios
        if: steps.convergence_lane.outcome == 'failure'
        continue-on-error: true
        run: |
          sudo prlimit --pid "$$" --memlock=unlimited:unlimited
          cargo run -p cgka-conformance-simulator \
            --bin cgka-conformance-simulator-report --locked -- \
            --family adversarial-reliability/v1 \
            --seed 7 \
            --cases 12 \
            --out target/cgka-conformance-simulator-nightly-reports \
            --storage file \
            --strict-oracle

      - name: Propagate nightly convergence failure
        if: steps.convergence_lane.outcome == 'failure'
        run: exit 1

      - name: Run simulator doctests
        run: |
          cargo run -p convergence-campaign-runner --bin cgka-distributed-campaign --locked -- \
            observe-step \
            --name simulator-doctests \
            --output "$CGKA_LANE_EVIDENCE_DIR/steps/simulator-doctests.json" \
            -- cargo test -p cgka-conformance-simulator --doc --locked

      - name: Build current distributed campaign image
        run: |
          cargo run -p convergence-campaign-runner --bin cgka-distributed-campaign --locked -- \
            observe-step \
            --name distributed-image-build \
            --output "$CGKA_LANE_EVIDENCE_DIR/steps/distributed-image-build.json" \
            -- docker build -f Dockerfile.convergence-campaign -t marmot-conformance:local .

      - name: Run selected real-container convergence campaign
        env:
          CGKA_CONVERGENCE_IMAGE: marmot-conformance:local
          CGKA_DISTRIBUTED_ARTIFACTS_DIR: ${{ github.workspace }}/target/cgka-distributed-container-evidence
        run: |
          cargo run -p convergence-campaign-runner --bin cgka-distributed-campaign --locked -- \
            observe-step \
            --name selected-container-campaigns \
            --output "$CGKA_LANE_EVIDENCE_DIR/steps/selected-container-campaigns.json" \
            -- cargo nextest run -p convergence-campaign-runner --test container_runtime --locked \
              --run-ignored ignored-only --no-tests fail \
              -E 'test(=real_container_nodes_survive_network_shaping_and_reach_exact_state) | test(=four_party_cross_route_recovery_containers_match_unified_route)'

      - name: Run encrypted file-backed vector report
        run: |
          cargo run -p convergence-campaign-runner --bin cgka-distributed-campaign --locked -- \
            observe-step \
            --name file-backed-vector-report \
            --output "$CGKA_LANE_EVIDENCE_DIR/steps/file-backed-vector-report.json" \
            -- cargo run -p cgka-conformance-simulator --bin cgka-conformance-simulator-report --locked -- \
              --vectors crates/cgka-conformance-simulator/vectors \
              --out target/cgka-conformance-simulator-nightly-reports \
              --storage file \
              --strict-oracle
          jq -s -e 'all(.[]; .metadata.storage_backend == "encrypted-file-sqlite")' \
            target/cgka-conformance-simulator-nightly-reports/*-report.json >/dev/null

      - name: Collect nightly lane observation
        if: always()
        run: |
          cargo run -p convergence-campaign-runner --bin cgka-distributed-campaign --locked -- \
            collect-observation \
            --step-dir "$CGKA_LANE_EVIDENCE_DIR/steps" \
            --artifact-root target/cgka-adversarial-reliability-ci \
            --artifact-root target/cgka-conformance-simulator-nightly-reports \
            --artifact-root target/cgka-distributed-container-evidence \
            --disk-root target \
            --output "$CGKA_LANE_EVIDENCE_DIR/observed-usage.v1.json"

      - name: Enforce nightly lane budget
        if: always()
        run: |
          cargo run -p convergence-campaign-runner --bin cgka-distributed-campaign --locked -- \
            check-budget nightly "$CGKA_LANE_EVIDENCE_DIR/observed-usage.v1.json" \
            --output "$CGKA_LANE_EVIDENCE_DIR/budget-evaluation.v1.json"

      - name: Upload nightly vector report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cgka-conformance-simulator-nightly-reports
          path: |
            target/cgka-conformance-simulator-nightly-reports
            target/cgka-distributed-container-evidence
            target/cgka-nightly-lane-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Report nightly failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          run_date="$(date -u +%F)"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Simulator nightly failed (${run_date})" \
            --body "The simulator nightly failed. Run: ${RUN_URL}"

  public-app-catchup:
    name: Public app 1024-message recovery
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "false"
      MDK_APP_JOURNEY_ARTIFACTS: ${{ github.workspace }}/target/public-app-catchup-evidence
      MDK_BACKLOG_TRACE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Cache production-policy Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: public-app-catchup-release

      - name: Record source provenance
        run: |
          umask 077
          mkdir -p target/public-app-catchup-evidence
          git rev-parse HEAD > target/public-app-catchup-evidence/source-commit.txt
          rustc --version > target/public-app-catchup-evidence/rust-version.txt

      - name: Build public recovery tests with production policy
        id: build_catchup
        timeout-minutes: 15
        # Keep this separate from workspace test-policy feature unification.
        run: >-
          cargo test --release --locked -p cgka-conformance-simulator
          --test app_runtime_journeys --no-run

      - name: Recover the original 1024-message backlog
        if: ${{ !cancelled() && steps.build_catchup.outcome == 'success' }}
        timeout-minutes: 20
        # Each journey owns a 900-second watchdog and closes every runtime.
        run: >-
          cargo test --release --locked -p cgka-conformance-simulator
          --test app_runtime_journeys public_app_1024_message_backlog_recovers_completely
          -- --exact --ignored --test-threads=1 --nocapture

      - name: Recover the 1024-message backlog with extra epochs
        if: ${{ !cancelled() && steps.build_catchup.outcome == 'success' }}
        timeout-minutes: 20
        run: >-
          cargo test --release --locked -p cgka-conformance-simulator
          --test app_runtime_journeys public_app_1024_message_backlog_with_extra_epochs_recovers_completely
          -- --exact --ignored --test-threads=1 --nocapture

      - name: Upload public recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-app-catchup-${{ github.sha }}
          path: |
            target/public-app-catchup-evidence/*.txt
            target/public-app-catchup-evidence/app-journey-*/*.json
          retention-days: 14
          if-no-files-found: warn

      - name: Report scheduled recovery failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          run_date="$(date -u +%F)"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Public app recovery nightly failed (${run_date})" \
            --body "The production-policy 1024-message recovery lane failed. Run and retained evidence: ${RUN_URL}"
