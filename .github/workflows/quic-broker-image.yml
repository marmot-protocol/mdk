name: QUIC Broker Image

on:
  pull_request:
    paths:
      - Dockerfile.quic-broker
      - Dockerfile.convergence-campaign
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - scripts/check_campaign_toolchain.sh
      - scripts/tests/test_campaign_toolchain.sh
      - crates/traits/**
      - crates/transport-quic-stream/**
      - crates/transport-quic-broker/**
      - .github/workflows/quic-broker-image.yml
      - '!*.md'
      - '!**/*.md'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Serialize publishers for a ref so an older build cannot overwrite latest.
  group: quic-broker-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  signatures:
    name: PR signatures
    permissions:
      contents: read
    uses: ./.github/workflows/pr-signatures.yml

  image:
    name: Build broker image
    needs: signatures
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify release image toolchain contract
        run: |
          ./scripts/check_campaign_toolchain.sh
          ./scripts/tests/test_campaign_toolchain.sh

      - name: Build image
        run: docker build -f Dockerfile.quic-broker -t marmot-quic-broker:ci .

      - name: Smoke test image
        run: docker run --rm marmot-quic-broker:ci --help

      - name: Save image
        if: github.event_name != 'pull_request'
        run: docker save -o "$RUNNER_TEMP/marmot-quic-broker.tar" marmot-quic-broker:ci

      - name: Upload image
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmot-quic-broker-image
          path: ${{ runner.temp }}/marmot-quic-broker.tar
          if-no-files-found: error
          overwrite: true
          # Long enough to rerun a publish that failed over a weekend.
          retention-days: 7

  # Only this job holds `packages: write`, and it runs no repository code: the
  # build above, which runs the checked-out scripts and Dockerfile, keeps a
  # read-only token.
  publish:
    name: Publish broker image
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: marmot-quic-broker-image
          path: ${{ runner.temp }}/image

      - name: Load image
        run: docker load -i "$RUNNER_TEMP/image/marmot-quic-broker.tar"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/marmot-quic-broker"
          sha_tag="sha-${GITHUB_SHA::12}"
          docker tag marmot-quic-broker:ci "$image:$sha_tag"
          docker push "$image:$sha_tag"
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            docker tag marmot-quic-broker:ci "$image:latest"
            docker push "$image:latest"
          fi
