      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-runner-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdk-ci-reports
          retention-days: 7
          if-no-files-found: warn

  formal:
    name: Tamarin proofs
    needs: changes
    if: needs.changes.outputs.ci_mode == 'full' && needs.changes.outputs.run_formal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Maude
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/maude.zip"
          # Retry any failure, doubling the wait (1 s, 2 s, 4 s ...); none is scheduled after 300 s.
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 300 \
            --retry 10 --retry-all-errors --retry-max-time 300 \
            https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip \
            --output "$archive"
          echo "72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  $archive" | sha256sum --check --strict
          directory="$RUNNER_TEMP/maude-3.5.1"
          mkdir -p "$directory"
          # Batch proving needs no Graphviz, and Python's zipfile replaces
          # unzip, so this job installs nothing from the Ubuntu archives.
          python3 -m zipfile -e "$archive" "$directory"
          chmod 755 "$directory/maude"
          echo "$directory" >> "$GITHUB_PATH"
          echo "MAUDE_LIB=$directory" >> "$GITHUB_ENV"
          export PATH="$directory:$PATH" MAUDE_LIB="$directory"
          maude --version | grep -Fx '3.5.1'

      - name: Install Tamarin
        env:
          TAMARIN_VERSION: 1.12.0
        run: |
          set -euo pipefail
          # Retry any failure, doubling the wait (1 s, 2 s, 4 s ...); none is scheduled after 300 s.
          curl -L --fail --show-error --silent \
            --connect-timeout 20 --max-time 300 \
            --retry 10 --retry-all-errors --retry-max-time 300 \
            "https://github.com/tamarin-prover/tamarin-prover/releases/download/${TAMARIN_VERSION}/tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz" \
            -o /tmp/tamarin-prover.tar.gz
          echo "201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  /tmp/tamarin-prover.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/tamarin-prover.tar.gz -C /tmp
          sudo install -m 0755 /tmp/tamarin-prover /usr/local/bin/tamarin-prover
          tamarin-prover --version

      - name: Check Tamarin prover runner tests
        run: python3 -B -m unittest discover -s formal/tamarin -p 'test_*.py'

      - name: Run Tamarin proofs
        run: make -C formal/tamarin prove

      - name: Check pairing verifier timeout handling
        run: python3 -B -m unittest discover -s formal/pairing -p 'test_*.py'

      - name: Verify pairing authentication and model controls
        run: python3 formal/pairing/verify_pairing.py --out target/formal-pairing

      - name: Preserve pairing proof and control evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pairing-symbolic-proof-${{ github.run_attempt }}
          path: target/formal-pairing
          retention-days: 7
          if-no-files-found: ignore

  hermes-installer-auth:
    name: Hermes installer auth
    needs: changes
    if: needs.changes.outputs.ci_mode == 'full' && needs.changes.outputs.run_hermes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          venv_check_dir="${RUNNER_TEMP}/hermes-venv-check"
          if command -v python3 >/dev/null \
            && command -v git >/dev/null \
            && python3 -m venv "$venv_check_dir"; then
            rm -rf "$venv_check_dir"
            exit 0
          fi
          rm -rf "$venv_check_dir"
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=15s 180s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "apt-get update failed after $attempt attempts" >&2
              exit 1
            fi
            echo "apt-get update attempt $attempt failed; retrying" >&2
          done
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            install -y --no-install-recommends python3 python3-venv git

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Hermes Python unit tests
        timeout-minutes: 3
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/hermes-doctor-oracle"
          uv pip install --python "$RUNNER_TEMP/hermes-doctor-oracle/bin/python" python-dotenv==1.2.2
          env -i HOME="$HOME" PATH="$PATH" USER="${USER:-runner}" \
            "$RUNNER_TEMP/hermes-doctor-oracle/bin/python" -c 'import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None)' discover -s integrations/hermes/tests/marmot -v

      - name: Prepare isolated Hermes environment for authorization E2E
        run: |
          set -euo pipefail
          ./scripts/hermes_marmot_dev_setup.sh \
            --root "$RUNNER_TEMP/hermes-installer-auth" \
            --install-pinned-wheel

      - name: Pinned Hermes approval host contract
        timeout-minutes: 3
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/hermes-installer-auth/env.sh"
          HERMES_APPROVAL_CONTRACT=1 PYTHONPATH="$HERMES_AGENT_REPO" \
            "$HERMES_AGENT_REPO/.venv/bin/python" -m unittest discover \
            -s integrations/hermes/tests/marmot -p test_approval_host_contract.py -v

      - name: Hermes installer unit and mock regressions
        run: |
          set -euo pipefail
          bash -n scripts/install-hermes-marmot.sh
          bash -n integrations/hermes/tests/marmot/test_installer_env.sh
          bash -n scripts/hermes_marmot_deterministic_e2e.sh
          python3 -m py_compile scripts/hermes_marmot_configure_gateway.py integrations/hermes/tests/marmot/e2e_gateway_auth.py
          integrations/hermes/tests/marmot/test_dev_scripts.sh

      - name: Pinned Hermes presence host contracts
        timeout-minutes: 3
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/hermes-installer-auth/env.sh"
          HERMES_PRESENCE_CONTRACT=1 PYTHONPATH="$HERMES_AGENT_REPO" \
            "$HERMES_AGENT_REPO/.venv/bin/python" -m unittest discover \
            -s integrations/hermes/tests/marmot -p test_presence_host_contract.py -v

      - name: Real Hermes authorization and deterministic Marmot E2E
        # About 10 s of work; bound a hang well inside the job's 30 minutes.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # The deterministic runner sources the pinned dev root, runs
          # test_installer_env.sh against its real GatewayRunner, then runs the
          # adapter E2E. A missing Hermes venv is a hard failure, not a skip.
          ./scripts/hermes_marmot_deterministic_e2e.sh --root "$RUNNER_TEMP/hermes-installer-auth"

  # Platform-neutral workspace dependencies reach this code too, so every full
  # run includes it rather than a Windows path filter.
  windows-filesystem:
    name: Windows filesystem contracts
    needs: changes
    if: needs.changes.outputs.ci_mode != 'fast'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Odin
        uses: ./.github/actions/setup-odin

      # On Windows, SChannel fails the TLS handshake whenever the certificate
      # authority's revocation server is unreachable
      # (CRYPT_E_REVOCATION_OFFLINE), and such outages have outlasted
      # install-action's minute of retries. --ssl-revoke-best-effort skips only
      # a revocation check that cannot be made; a certificate reported revoked
      # still fails. The archive is trusted only once it matches its pin.
      - name: Install pinned cargo-nextest
        shell: bash
        run: |
          set -euo pipefail
          version=0.9.132
          temporary="$(cygpath -u "$RUNNER_TEMP")"
          archive="$temporary/cargo-nextest.tar.gz"
          # Retry any failure, doubling the wait (1 s, 2 s, 4 s ...); none is scheduled after 300 s.
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --ssl-revoke-best-effort --connect-timeout 20 --max-time 300 \
            --retry 10 --retry-all-errors --retry-max-time 300 \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$version/cargo-nextest-$version-x86_64-pc-windows-msvc.tar.gz" \
            --output "$archive"
          echo "6f934574f621613d7d759547401a04619b3e1ebe1f4e8f624880197d566fa6ad  $archive" | sha256sum --check --strict
          directory="$temporary/cargo-nextest-$version"
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory"
          cygpath -w "$directory" >> "$GITHUB_PATH"
          "$directory/cargo-nextest.exe" nextest --version | grep -F "cargo-nextest $version ("

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The Windows code lives in fs-private, account file replacement and
      # local audit delivery, and is covered by those crates' unit tests,
      # marmot-account's home tests and marmot-forensics' audit tests.
      - name: Test filesystem, account replacement, and audit delivery
        run: >-
          cargo nextest run --locked -p fs-private -p marmot-account -p marmot-forensics

      # The account runtime's unit tests, which ran in the step above until the
      # runtime moved from marmot-account to marmot-session. Only the library
      # runs: marmot-session's test binaries, the runtime's publish, fanout and
      # maintenance scenarios and the session's, are platform-neutral and run
      # on Linux CI, and the runtime's took over 30 minutes here.
      - name: Test account runtime units
        run: cargo nextest run --locked -p marmot-session --lib

      - name: Test runtime root ownership
        run: >-
          cargo nextest run --locked -p marmot-app --lib
          -E 'test(root_runtime_lease)'

  # A merge-group run stops at its first failed job. `Required CI` waits for
  # every job, so without this one failure would hold the PR, and every group
  # built on top of it, in the queue until the slowest job finished. Cancelling
  # the run cancels the jobs still running; `Required CI` still runs, sees
  # them cancelled and fails, and the queue ejects the PR. The run also stops
  # once the queue drops its group, for example to rebuild it after a group
  # ahead failed; GitHub leaves that run going, holding runners the rebuilt
  # groups need, and its `Required CI` reports on a commit the queue no longer
  # tracks. This is the only job with `actions: write` and runs no repository
  # code. It is not one of `Required CI`'s needs, since it waits for that job
  # to appear, and it must never fail a run whose required jobs passed.
  merge-group-fail-fast:
    name: Merge-group fail-fast
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 160
    continue-on-error: true
    permissions:
      actions: write
      checks: read
      contents: read

    steps:
      - name: Cancel the run when a job fails
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_REF: ${{ github.ref }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Stop watching before the job timeout. Two requests a minute keep
          # a run to about 80 of the token's hourly budget.
          deadline=$((SECONDS + 150 * 60))
          # Look up the group's branch only when the event names one;
          # otherwise watch for failed jobs alone.
          if [[ "$HEAD_REF" != refs/heads/?* || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            HEAD_REF=""
          fi
          dropped=0
          while (( SECONDS < deadline )); do
            # One line per job: name, status, conclusion, check URL. Retry a
            # failed request on the next poll.
            if jobs="$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
                --jq '.jobs[] | [.name, .status, .conclusion // "", .check_run_url // ""] | @tsv')"; then
              # Required CI starts only once every other job has finished.
              if awk -F '\t' '$1 == "Required CI" { found = 1 } END { exit !found }' <<<"$jobs"; then
                exit 0
              fi
              # Merge groups accept only success, so any other conclusion
              # already fails Required CI.
              failed="$(awk -F '\t' '$2 == "completed" && $3 != "success" && $3 != "skipped"' <<<"$jobs")"
              if [[ -n "$failed" ]]; then
                printf 'Cancelling the run after:\n%s\n' "$failed"
                # A dead runner may never upload logs or artifacts. Preserve
                # its server-side failure annotations on this healthy runner
                # before cancellation; unavailable annotations never block it.
                while IFS=$'\t' read -r name _status _conclusion check; do
                  if [[ -n "$check" ]]; then
                    printf 'Failure annotations for %s:\n' "$name"
                    gh api "$check/annotations" \
                      --jq '.[] | select(.annotation_level == "failure") | .message' || true
                  fi
                done <<<"$failed"
                gh run cancel "$RUN_ID" && exit 0
              elif [[ -n "$HEAD_REF" ]]; then
                # The queue deletes a dropped group's branch and may give its
                # name to a later group on the same base. A passed group's
                # branch is deleted only after Required CI has run, so the
                # check above exits first. Cancel only once two lookups in a
                # row, a minute apart, succeed without finding this commit; a
                # failed lookup proves nothing.
                if sha="$(gh api "repos/$GH_REPO/git/matching-refs/${HEAD_REF#refs/}" \
                    --jq '.[] | select(.ref == env.HEAD_REF) | .object.sha')" && [[ "$sha" != "$HEAD_SHA" ]]; then
                  dropped=$((dropped + 1))
                else
                  dropped=0
                fi
                if (( dropped >= 2 )); then
                  printf 'Cancelling the run: the merge queue dropped %s at %s\n' "$HEAD_REF" "$HEAD_SHA"
                  gh run cancel "$RUN_ID" && exit 0
                fi
              fi
            fi
            sleep 60
          done

  required-ci:
    name: Required CI
    # `always()`, not `!cancelled()`: this must also run, and fail, after
    # merge-group-fail-fast cancels the run.
    if: always()
    needs:
      - signatures
      - changes
      - rust-format
      - rust-audit
      - terminal-harness-installers
      - rust-wasm-check
      - rust-clippy
      - c-smoke
      - ios-account-clippy
      - marmotkit-native-host
      - convergence-policy-pin
      - rust-test-build
      - rust-test
      - rust-test-extras
      - cli-e2e-build
      - cli-e2e
      - relay-runtime-build
      - relay-runtime
      - relay-e2e
      - conformance-build
      - conformance
      - conformance-extras
      - formal
      - hermes-installer-auth
      - windows-filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A full run selects every job, so a skip there means a broken condition
      # rather than an unaffected lane. Merge groups and external/fork PRs must
      # be full runs; team PRs in fast mode must still pass signatures, changes
      # (including tree-state), and rust-format.
      - name: Require every selected core CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          CI_MODE: ${{ needs.changes.outputs.ci_mode }}
          IS_TEAM_PR: ${{ needs.changes.outputs.is_team_pr }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if [[ "$EVENT_NAME" == merge_group && "$CI_MODE" != full ]]; then
            echo "error: merge group selected CI mode '$CI_MODE', not full" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == pull_request && "$IS_TEAM_PR" != true && "$CI_MODE" != full ]]; then
            echo "error: non-team pull request selected CI mode '$CI_MODE', not full" >&2
            exit 1
          fi
          case "$CI_MODE" in
            full)
              jq --exit-status 'all(.[]; .result == "success")' <<<"$NEEDS"
              ;;
            fast)
              jq --exit-status '
                .signatures.result == "success"
                and .changes.result == "success"
                and .["rust-format"].result == "success"
                and all(.[]; .result | IN("success", "skipped"))
              ' <<<"$NEEDS"
              ;;
            warm)
              jq --exit-status '
                .signatures.result == "success"
                and .changes.result == "success"
                and all(.[]; .result | IN("success", "skipped"))
              ' <<<"$NEEDS"
              ;;
            *)
              echo "error: unrecognized or missing CI mode '$CI_MODE'" >&2
              exit 1
              ;;
          esac
