name: CI

# Team pull requests run a fast static gate (~1 minute, zero Rust compile):
# verified commit signatures, tree-state check (fail closed when `tree-state`
# is red unless labeled `tree-fix`/`revert`), formatting, static/contract
# gates, and advisory commit-trailer checks. External/fork pull requests,
# `ci:full` pull requests, `workflow_dispatch`, and `merge_group` runs execute
# the full CI matrix. Post-merge verification runs continuously on `master`
# (advancing `canary`). Master pushes refresh Rust caches only when a
# rust-cache input changes.
#
# GitHub evicts the least recently used caches once a repository passes 10 GB,
# so that budget holds only the caches saved here and the wn-agent darwin
# builds, which wait for the shared macOS runners. Other workflows build without
# a cache or restore one of these with `save-if: false`;
# scripts/test_ci_workflow_policy.py checks it. The one other saver is the
# setup-odin action, which keeps the pinned Odin archive from master runs: one
# per platform, at most four, about 350 MB in all.
on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/rust-toolchain"
      - "**/rust-toolchain.toml"
      - "**/.cargo/config.toml"
      - .github/workflows/ci.yml
      - .github/actions/setup-odin/**
      - scripts/install-odin.sh
  merge_group:
  workflow_dispatch:
    inputs:
      archive_layout_experiment:
        description: Compare full and binary-local test archives
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Pull requests and cache-refresh pushes supersede their own older runs. A
  # unique group protects merge-group and manual runs: GitHub otherwise
  # replaces older pending runs even when cancel-in-progress is false.
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Match cargo build/check dependencies to the existing test profile.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The workspace test jobs leave out the suites that have their own jobs:
  # `wn-cli::cli` (cli-e2e) and `marmot-app::relay_runtime` (relay-runtime).
  WORKSPACE_FILTER: not (package(marmot-app) & binary(relay_runtime)) and not (package(wn-cli) & binary(cli))

jobs:
  archive-layout-experiment:
    if: github.event_name == 'workflow_dispatch' && inputs.archive_layout_experiment
    needs: signatures
    uses: ./.github/workflows/archive-layout-experiment.yml

  signatures:
    name: PR signatures
    permissions:
      contents: read
    uses: ./.github/workflows/pr-signatures.yml

  changes:
    name: Classify CI changes
    needs: signatures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci_mode: ${{ steps.mode.outputs.ci_mode }}
      is_team_pr: ${{ steps.trust.outputs.is_team_pr }}
      run_full: ${{ steps.classify.outputs.run_full }}
      run_c: ${{ steps.classify.outputs.run_c }}
      run_conformance: ${{ steps.classify.outputs.run_conformance }}
      run_ios: ${{ steps.classify.outputs.run_ios }}
      run_formal: ${{ steps.classify.outputs.run_formal }}
      run_hermes: ${{ steps.classify.outputs.run_hermes }}
      run_installers: ${{ steps.classify.outputs.run_installers }}
      apple_opt_in: ${{ steps.labels.outputs.apple_opt_in }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Read labels live so adding ci:full, ci:apple, tree-fix, or revert
      # followed by "Re-run all jobs" takes effect without a new source commit.
      - name: Check CI opt-in labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels='[]'
          if [[ -n "$PR_NUMBER" ]]; then
            labels="$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[].name]')"
          fi
          echo "full_ci=$(jq 'index("ci:full") != null' <<<"$labels")" >> "$GITHUB_OUTPUT"
          echo "apple_opt_in=$(jq 'index("ci:apple") != null or index("ci:full") != null' <<<"$labels")" >> "$GITHUB_OUTPUT"
          echo "tree_bypass=$(jq 'index("tree-fix") != null or index("revert") != null' <<<"$labels")" >> "$GITHUB_OUTPUT"

      # Only branches pushed directly to this repository (non-fork) by a repo
      # OWNER, MEMBER, or COLLABORATOR qualify for the fast static PR gate.
      # External/fork PRs always fail closed into full CI on GitHub runners.
      - name: Classify PR trust
        id: trust
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_FORK: ${{ github.event.pull_request.head.repo.fork }}
          AUTHOR_ASSOC: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail
          is_team_pr=false
          if [[ "$EVENT_NAME" == "pull_request" && -n "$HEAD_REPO" && "$HEAD_REPO" == "$REPO" && "$HEAD_FORK" != "true" ]]; then
            case "$AUTHOR_ASSOC" in
              OWNER|MEMBER|COLLABORATOR) is_team_pr=true ;;
            esac
          fi
          echo "is_team_pr=$is_team_pr" >> "$GITHUB_OUTPUT"

      # Fail closed when the signed `tree-state` orphan branch reports non-green,
      # allowing only team PRs labeled `tree-fix` or `revert` to land fixes.
      - name: Check tree state
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IS_TEAM_PR: ${{ steps.trust.outputs.is_team_pr }}
          TREE_BYPASS: ${{ steps.labels.outputs.tree_bypass }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "tree-state: skipped for $EVENT_NAME"
            exit 0
          fi
          state=""
          if raw="$(gh api "repos/$REPO/contents/state.json?ref=tree-state" --jq '.content' 2>/dev/null)" \
            && decoded="$(tr -d '\n' <<<"$raw" | base64 -d 2>/dev/null)"; then
            state="$(jq -r 'if type == "object" and (.state | type == "string") then .state else "" end' <<<"$decoded" 2>/dev/null || true)"
          fi
          if [[ "$state" == "green" ]]; then
            echo "tree-state: green"
            exit 0
          fi
          if [[ "$IS_TEAM_PR" == "true" && "$TREE_BYPASS" == "true" ]]; then
            echo "tree-state: '${state:-unknown}' bypassed by team PR tree-fix/revert label"
            exit 0
          fi
          echo "error: tree-state is '${state:-unknown}' (expected 'green'); only team PRs labeled 'tree-fix' or 'revert' may merge while master is red" >&2
          exit 1

      # fast: team pull requests without `ci:full` run signatures, tree-state,
      # formatting, static gates, and advisory trailer checks (zero compile).
      # full: external/fork PRs, `ci:full` PRs, merge groups, and manual runs
      # execute every CI job.
      # warm: master pushes run only the jobs that save a Rust cache.
      - name: Select CI mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ steps.labels.outputs.full_ci }}
          IS_TEAM_PR: ${{ steps.trust.outputs.is_team_pr }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              if [[ "$FULL_CI" == true ]]; then
                mode=full
              elif [[ "$IS_TEAM_PR" == true ]]; then
                mode=fast
              else
                mode=full
              fi
              ;;
            push) mode=warm ;;
            *) mode=full ;;
          esac
          echo "ci_mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_MODE: ${{ steps.mode.outputs.ci_mode }}
        run: |
          set -euo pipefail
          umask 077
          paths="$RUNNER_TEMP/ci-changes"
          : > "$paths"
          flags=()
          if [[ "$CI_MODE" != fast || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] \
            || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            flags=(--all)
          else
            # Include removed paths and rename sources.
            git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$paths"
          fi
          python3 scripts/classify_ci_changes.py "${flags[@]}" --github-output "$GITHUB_OUTPUT" < "$paths"

      - name: PR commit trailers (advisory)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            python3 scripts/check_pr_trailers.py --advisory \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              || echo "::warning title=PR trailers::advisory check failed unexpectedly"
          fi

  rust-format:
    name: Rust format
    needs: signatures
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Naming gate (retired legacy tokens)
        run: ./scripts/check_legacy_naming.sh

      - name: Tracing and direct-output source audit
        run: |
          ./scripts/check_tracing_audit.sh
          python3 scripts/test_check_tracing_audit.py

      - name: C binding command-surface parity gate
        run: python3 scripts/check_c_binding_parity.py

      - name: Complete binding documentation inventory
        run: |
          python3 scripts/check_binding_docs.py
          python3 scripts/test_check_binding_docs.py

      - name: Changelog fragments
        run: |
          python3 scripts/changelog.py check
          python3 scripts/test_changelog.py

      - name: PR commit trailers contract
        run: python3 scripts/test_check_pr_trailers.py

      - name: Binding build phase contracts
        run: |
          python3 crates/marmot-uniffi/test-build-phases.py
          python3 crates/marmot-uniffi/test-android-artifact.py

      - name: Install example SHA-256 gate
        run: |
          python3 scripts/check_install_example_sha256.py
          python3 scripts/test_install_example_sha256_gate.py

      - name: Campaign image toolchain gate
        run: |
          ./scripts/check_campaign_toolchain.sh
          ./scripts/tests/test_campaign_toolchain.sh

      - name: Apple privacy packaging gate
        run: python3 crates/marmot-uniffi/test-apple-privacy.py

      - name: MarmotKit release-profile gate
        run: python3 crates/marmot-uniffi/test-release-profile.py

      - name: Agent install documentation gate
        run: ./scripts/check_agent_install_docs.sh

      - name: Public app campaign contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_app_stack_campaign.py'

      - name: CI policy and path-classifier gates
        run: |
          ./scripts/check_convergence_constant_ledger.sh
          python3 scripts/test_check_cargo_audit_ci.py
          python3 scripts/test_classify_ci_changes.py
          python3 scripts/test_ci_workflow_policy.py
          python3 scripts/test_flake_report.py

      - name: Test timing ratchet
        run: |
          python3 scripts/check_test_timing_ratchet.py
          python3 scripts/test_check_test_timing_ratchet.py

  rust-audit:
    name: Rust audit
    needs: changes
    if: needs.changes.outputs.ci_mode != 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-audit
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-audit@0.22.1

      - name: Audit Rust dependencies
        # Cargo consumes --locked before dispatching to cargo-audit; cargo-audit
        # itself does not accept --locked after the subcommand.
        run: cargo --locked audit

  terminal-harness-installers:
    name: Terminal harness installer tests
    needs: changes
    if: needs.changes.outputs.ci_mode == 'full' && needs.changes.outputs.run_installers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Test Claude Code, Codex, Pi, OpenCode, and Goose installers
        run: |
          set -euo pipefail
          integrations/terminal-harness/tests/test_installer.sh claude
          integrations/terminal-harness/tests/test_installer.sh codex
          integrations/terminal-harness/tests/test_installer.sh pi
          integrations/terminal-harness/tests/test_installer.sh opencode
          integrations/terminal-harness/tests/test_installer.sh goose

      - name: Test the connector-only wn-agent installer
        run: integrations/terminal-harness/tests/test_connector_only_installer.sh

  rust-wasm-check:
    name: Rust WASM check
    needs: changes
    if: needs.changes.outputs.ci_mode != 'fast' && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Prepare runner disk
        env:
          MDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/ci_runner.py prepare

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version
          clang --version
          # Preflight the C toolchain before compiling ring for this target.
          clang --print-targets | grep wasm32

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Compile-only regression gate. Browser runtime behavior belongs in
      # downstream headless-browser acceptance tests.
      - name: Build browser WASM libraries
        env:
          CC_wasm32_unknown_unknown: clang
          RUSTFLAGS: -D warnings
        run: |
          cargo build --locked --target wasm32-unknown-unknown \
            -p cgka-traits \
            -p cgka-engine \
            -p transport-nostr-peeler

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-runner-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdk-ci-reports
          retention-days: 7
          if-no-files-found: warn

  rust-clippy:
    name: Rust check and clippy
    env:
      RUSTFLAGS: -D warnings
    needs: changes
    if: needs.changes.outputs.ci_mode != 'fast' && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Prepare runner disk
        env:
          MDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/ci_runner.py prepare
      - name: Install pinned Odin
        uses: ./.github/actions/setup-odin

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run clippy with all features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-runner-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdk-ci-reports
          retention-days: 7
          if-no-files-found: warn

  c-smoke:
    name: C bindings smoke
    needs: changes
    if: needs.changes.outputs.ci_mode != 'fast' && needs.changes.outputs.run_c == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Prepare runner disk
        env:
          MDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/ci_runner.py prepare
      - name: Install pinned Odin
        uses: ./.github/actions/setup-odin

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cbindgen
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cbindgen@0.29.4

      - name: Header diff gate
        run: |
          set -euo pipefail
          # Pin the exact version so a newer cbindgen can't reformat the
          # checked-in header and fail the diff gate on unrelated PRs.
          # RUSTC_BOOTSTRAP=1 lets cbindgen expand the mirror-generating
          # macros on stable; it only affects header generation.
          RUSTC_BOOTSTRAP=1 cbindgen --config crates/marmot-c/cbindgen.toml --crate marmot-c \
            --output crates/marmot-c/include/marmot.h crates/marmot-c
          git diff --exit-code crates/marmot-c/include/marmot.h

      - name: Alloc-audit tests
        run: cargo test -p marmot-c --features alloc-audit --locked

      - name: Compile and run debug C smoke test (gcc)
        run: ./crates/marmot-c/c-smoke.sh --debug gcc

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-runner-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdk-ci-reports
          retention-days: 7
          if-no-files-found: warn

  # Pull requests run this and marmotkit-native-host only with the `ci:apple`
  # or `ci:full` label; merge groups always run them, so they gate merging.
  ios-account-clippy:
    name: iOS keychain and Swift cancellation
    needs: changes
    if: >-
      needs.changes.outputs.run_ios == 'true'
      && (needs.changes.outputs.ci_mode != 'fast' || needs.changes.outputs.apple_opt_in == 'true')
    runs-on: macos-latest
    # The cancellation smoke builds the shipped release profile (thin LTO, one
    # codegen unit), which grows with marmot-app. Queue runs took 16-27
    # minutes in November 2026, and pending marmot-app code adds about 3; this
    # keeps half of that 30 again in reserve for a slow runner.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Odin
        uses: ./.github/actions/setup-odin

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustup default "$toolchain"
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # marmot-account holds the keychain code. marmot-session holds the
      # account runtime, which this step linted as part of marmot-account
      # before the runtime moved there.
      - name: Check iOS account keychain code
        run: cargo clippy -p marmot-account -p marmot-session --target aarch64-apple-ios --locked -- -D warnings

      - name: Verify Swift subscription cancellation against native futures
        run: bash crates/marmot-uniffi/subscription-cancellation-smoke.sh

  # The native-host smoke builds a debug library with dev-dependency features,
  # so it shares no Cargo artifacts with the release build above. Its own job
  # runs beside that one instead of after it. It restores no Rust cache: the
  # cache budget is full, and this job finishes well before its sibling.
  marmotkit-native-host:
    name: MarmotKit native host lifecycle
    needs: changes
    if: >-
      needs.changes.outputs.run_ios == 'true'
      && (needs.changes.outputs.ci_mode != 'fast' || needs.changes.outputs.apple_opt_in == 'true')
    runs-on: macos-latest
    # The smoke took 6-9 minutes as a step of ios-account-clippy.
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install pinned Odin
        uses: ./.github/actions/setup-odin

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Verify native MarmotKit host lifecycle
        run: bash crates/marmot-uniffi/native-host-smoke.sh

  # The broader integration matrix explicitly enables test-policy-overrides.
  # This focused default-feature job proves ordinary debug/release consumers
  # reject every non-v1 convergence policy (mdk#970).
  convergence-policy-pin:
    name: Convergence policy pin (release assertions)
    needs: changes
    if: needs.changes.outputs.ci_mode != 'fast' && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Prepare runner disk
        env:
          MDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/ci_runner.py prepare

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run default-build convergence policy pin tests
        # Keep in sync with `just test-convergence-policy-pin`.
        run: cargo test -p cgka-engine --test convergence_policy_pin --locked

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-runner-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdk-ci-reports
          retention-days: 7
          if-no-files-found: warn

  # Full runs archive the workspace tests for the test shards. Master pushes
  # build them only to save the Rust caches; the jobs that run them need the
  # full mode.
  rust-test-build:
    name: Build workspace tests
    needs: changes
    if: needs.changes.outputs.ci_mode != 'fast' && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Prepare runner disk
        env:
          MDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/ci_runner.py prepare
      - name: Install pinned Odin
        uses: ./.github/actions/setup-odin

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          shared-key: rust-test

      - name: Verify workspace shard coverage
        run: python3 scripts/ci_runner.py run workspace-build -- bash scripts/check_ci_partitions.sh slice:14 --workspace --exclude cgka-conformance-simulator --features wn-cli/test-policy-overrides,cgka-engine/test-policy-overrides,cgka-engine/test-crash-hooks --locked --timings --profile ci -E "$WORKSPACE_FILTER"

      - name: Upload workspace compiler timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workspace-compiler-timings
          path: target/cargo-timings/*.html
          overwrite: true
          retention-days: 7

      - name: Archive workspace tests
        run: python3 scripts/ci_runner.py run rust-test-build -- cargo nextest archive --workspace --exclude cgka-conformance-simulator --features wn-cli/test-policy-overrides,cgka-engine/test-policy-overrides,cgka-engine/test-crash-hooks --locked --profile ci -E "$WORKSPACE_FILTER" --archive-file tests.tar.zst

      - name: Verify and describe test archive
        run: python3 scripts/ci_runner.py manifest tests.tar.zst

      - name: Upload test archive
        if: needs.changes.outputs.ci_mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-test
          path: |
            tests.tar.zst
            tests.tar.zst.manifest.json
          compression-level: 0
          overwrite: true
          retention-days: 1
          if-no-files-found: error

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-runner-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdk-ci-reports
          retention-days: 7
          if-no-files-found: warn

  # Fourteen shards keep the slowest one near 15 minutes. Each shard's tests run
  # four at a time, so its time tracks its total test time, and the slowest
  # runners add up to a fifth to that. That total grows fast (it doubled in the
  # second half of October 2026, #2738), so add shards before the slowest one
  # passes 20 minutes. `slice:` deals the whole test list out in turn, which
  # stays balanced as tests are added; `count:` restarts the deal for every test
  # binary, so each binary's first test lands on shard 1.
  # The 2 GB test archive downloads in under a minute on East US runners, has
  # taken up to 20 minutes on central and western ones (#2568), and has also
  # stalled until timeout (#3465). A 5-minute first attempt cuts a stalled
  # connection short and retries once with the full 25-minute budget so slow
  # runners still finish, keeping download and test budgets separate inside 65
  # minutes.
