        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Download test archive
        id: download-archive
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-e2e

      - name: Retry test archive download
        if: steps.download-archive.outcome == 'failure'
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cli-e2e

      - name: Verify and extract test archive
        run: python3 scripts/ci_runner.py extract tests.tar.zst

      - name: Start local relay stack
        run: docker compose up -d setup nostr-rs-relay strfry-nostr-relay

      - name: Wait for local relays
        run: |
          docker compose ps
          ./scripts/wait_for_relays.sh

      - name: Run real relay CLI E2E
        env:
          MDK_E2E_REQUIRE_RELAYS: "1"
        run: python3 scripts/ci_runner.py run relay-e2e -- cargo nextest run --cargo-metadata target/nextest/cargo-metadata.json --binaries-metadata target/nextest/binaries-metadata.json --workspace-remap "$GITHUB_WORKSPACE" --target-dir-remap "$GITHUB_WORKSPACE/target" --profile ci -E 'test(=real_local_relays_deliver_cli_messages_over_sdk_path)'

      - name: Dump local relay logs
        if: failure()
        run: docker compose logs nostr-rs-relay strfry-nostr-relay || true

      - name: Stop local relay stack
        if: always()
        run: docker compose down -v

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-runner-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdk-ci-reports
          retention-days: 7
          if-no-files-found: warn

  conformance-build:
    name: Build simulator tests
    needs: changes
    if: needs.changes.outputs.ci_mode != 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Prepare runner disk
        env:
          MDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/ci_runner.py prepare
      - name: Install pinned Odin
        uses: ./.github/actions/setup-odin

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Install just
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # just
        with:
          tool: just

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          shared-key: simulator-tests

      - name: Verify simulator smoke shard coverage
        run: bash scripts/check_ci_partitions.sh count:2 -p cgka-conformance-simulator --locked --profile ci -E "$(just --evaluate simulator-smoke-filter) and not binary(offline_catchup_regression)"

      - name: Archive default-feature simulator tests
        run: python3 scripts/ci_runner.py run conformance-build -- cargo nextest archive -p cgka-conformance-simulator --locked --profile ci --archive-file simulator.tar.zst

      - name: Verify and describe test archive
        if: needs.changes.outputs.ci_mode != 'fast'
        run: python3 scripts/ci_runner.py manifest simulator.tar.zst

      - name: Upload simulator test archive
        if: needs.changes.outputs.ci_mode == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: simulator-tests
          path: |
            simulator.tar.zst
            simulator.tar.zst.manifest.json
          compression-level: 0
          overwrite: true
          retention-days: 1
          if-no-files-found: error

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-runner-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdk-ci-reports
          retention-days: 7
          if-no-files-found: warn

  conformance:
    name: Simulator and vectors (${{ matrix.lane }})
    needs: [changes, conformance-build]
    if: needs.changes.outputs.ci_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Three jobs, balanced by measured runtime, keep this matrix off the
      # critical path while holding fewer of the organization's runner slots.
      matrix:
        include:
          - lane: offline-history
            groups: offline-history
          - lane: smoke-1, models
            groups: smoke-1 models
          - lane: smoke-2, process
            groups: smoke-2 process

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Prepare runner disk
        env:
          MDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/ci_runner.py prepare

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Install just
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # just
        with:
          tool: just

      - name: Download simulator test archive
        id: download-archive
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: simulator-tests

      - name: Retry simulator test archive download
        if: steps.download-archive.outcome == 'failure'
        timeout-minutes: 15
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: simulator-tests

      - name: Verify and extract test archive
        run: python3 scripts/ci_runner.py extract simulator.tar.zst

      - name: Run archived simulator tests
        env:
          SIM_GROUPS: ${{ matrix.groups }}
        run: |
          set -euo pipefail
          nextest=(python3 scripts/ci_runner.py run simulator -- cargo nextest run
            --cargo-metadata target/nextest/cargo-metadata.json
            --binaries-metadata target/nextest/binaries-metadata.json
            --workspace-remap "$GITHUB_WORKSPACE"
            --target-dir-remap "$GITHUB_WORKSPACE/target")
          # Callers run each group under `||`, where errexit is suspended, so
          # every group returns its own status and the models loop collects it.
          run_group() {
            case "$1" in
              smoke-*)
                "${nextest[@]}" --profile ci --partition "count:${1#smoke-}/2" \
                  -E "$(just --evaluate simulator-smoke-filter) and not binary(offline_catchup_regression)"
                ;;
              offline-history)
                "${nextest[@]}" --profile ci -E 'binary(=offline_catchup_regression)'
                ;;
              process)
                "${nextest[@]}" --profile ci \
                  -E "binary(=process_orchestrator) and ($(just --evaluate simulator-process-filter))"
                ;;
              models)
                local status=0
                for binary in route_assurance independent_reference_model lifecycle_model mutation_adequacy protocol_decision_gate semantic_reduction; do
                  "${nextest[@]}" --profile ci -E "binary(=$binary)" || status=1
                done
                return "$status"
                ;;
              *) return 2 ;;
            esac
          }
          # Run every group even after a failure so one job reports all of them.
          failed=()
          for group in $SIM_GROUPS; do
            run_group "$group" || failed+=("$group")
          done
          if (( ${#failed[@]} )); then
            echo "error: simulator groups failed: ${failed[*]}" >&2
            exit 1
          fi

      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-runner-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mdk-ci-reports
          retention-days: 7
          if-no-files-found: warn

  conformance-extras:
    name: Convergence gates and simulator doctests
    needs: changes
    if: needs.changes.outputs.ci_mode != 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Prepare runner disk
        env:
          MDK_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 scripts/ci_runner.py prepare
      - name: Install pinned Odin
        uses: ./.github/actions/setup-odin

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Install just
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # just
        with:
          tool: just

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
