name: CI

# The merge queue is the merge gate and runs the full matrix. Pull requests run
# a fast pre-check (format, static gates, audit, clippy, WASM build) unless
# labelled `ci:full`. The queue fast-forwards master to the commit it tested, so
# master pushes only refresh the Rust caches pull requests and merge groups
# restore: GitHub scopes a cache saved by a merge-group run to its temporary
# branch. Those pushes run only when an input of the rust-cache key changes.
on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/rust-toolchain"
      - "**/rust-toolchain.toml"
      - "**/.cargo/config.toml"
      - .github/workflows/ci.yml
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests and cache-refresh pushes supersede their own older runs. A
  # unique group protects merge-group and manual runs: GitHub otherwise
  # replaces older pending runs even when cancel-in-progress is false.
  group: ci-${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Match cargo build/check dependencies to the existing test profile.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # The workspace test jobs leave out the suites that have their own jobs:
  # `wn-cli::cli` (cli-e2e) and `marmot-app::relay_runtime` (relay-runtime).
  WORKSPACE_FILTER: not (package(marmot-app) & binary(relay_runtime)) and not (package(wn-cli) & binary(cli))

jobs:
  changes:
    name: Classify CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci_mode: ${{ steps.mode.outputs.ci_mode }}
      run_full: ${{ steps.classify.outputs.run_full }}
      run_c: ${{ steps.classify.outputs.run_c }}
      run_conformance: ${{ steps.classify.outputs.run_conformance }}
      run_ios: ${{ steps.classify.outputs.run_ios }}
      run_formal: ${{ steps.classify.outputs.run_formal }}
      run_hermes: ${{ steps.classify.outputs.run_hermes }}
      run_installers: ${{ steps.classify.outputs.run_installers }}
      apple_opt_in: ${{ steps.labels.outputs.apple_opt_in }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Read labels live so adding ci:full or ci:apple followed by "Re-run all
      # jobs" selects the requested coverage without a new source commit.
      - name: Check CI opt-in labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          labels='[]'
          if [[ -n "$PR_NUMBER" ]]; then
            labels="$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[].name]')"
          fi
          echo "full_ci=$(jq 'index("ci:full") != null' <<<"$labels")" >> "$GITHUB_OUTPUT"
          echo "apple_opt_in=$(jq 'index("ci:apple") != null or index("ci:full") != null' <<<"$labels")" >> "$GITHUB_OUTPUT"

      # precheck: pull requests without `ci:full` run only the fast gates.
      # full: merge groups, manual runs and `ci:full` run every job.
      # warm: master pushes run only the jobs that save a Rust cache.
      - name: Select CI mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ steps.labels.outputs.full_ci }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) if [[ "$FULL_CI" == true ]]; then mode=full; else mode=precheck; fi ;;
            push) mode=warm ;;
            *) mode=full ;;
          esac
          echo "ci_mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_MODE: ${{ steps.mode.outputs.ci_mode }}
        run: |
          set -euo pipefail
          umask 077
          paths="$RUNNER_TEMP/ci-changes"
          : > "$paths"
          flags=()
          if [[ "$CI_MODE" != precheck || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] \
            || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            flags=(--all)
          else
            # Include removed paths and rename sources.
            git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$paths"
          fi
          python3 scripts/classify_ci_changes.py "${flags[@]}" --github-output "$GITHUB_OUTPUT" < "$paths"

  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Naming gate (retired legacy tokens)
        run: ./scripts/check_legacy_naming.sh

      - name: C binding command-surface parity gate
        run: python3 scripts/check_c_binding_parity.py

      - name: Complete binding documentation inventory
        run: |
          python3 scripts/check_binding_docs.py
          python3 scripts/test_check_binding_docs.py

      - name: Binding build phase contracts
        run: |
          python3 crates/marmot-uniffi/test-build-phases.py
          python3 crates/marmot-uniffi/test-android-artifact.py

      - name: Install example SHA-256 gate
        run: |
          python3 scripts/check_install_example_sha256.py
          python3 scripts/test_install_example_sha256_gate.py

      - name: Campaign and QUIC broker image toolchain gate
        run: |
          ./scripts/check_campaign_toolchain.sh
          ./scripts/tests/test_campaign_toolchain.sh

      - name: Apple privacy packaging gate
        run: python3 crates/marmot-uniffi/test-apple-privacy.py

      - name: MarmotKit release-profile gate
        run: python3 crates/marmot-uniffi/test-release-profile.py

      - name: Agent install documentation gate
        run: ./scripts/check_agent_install_docs.sh

      - name: Public app campaign contract
        run: python3 -m unittest discover -s scripts/tests -p 'test_app_stack_campaign.py'

      - name: Install uv for audit receiver contract
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Audit OTLP receiver contract
        run: uv run --with 'jsonschema==4.25.1' python -m unittest discover -s scripts/audit-otlp-receiver -p 'test_receiver.py' -v

      - name: CI policy and path-classifier gates
        run: |
          ./scripts/check_convergence_constant_ledger.sh
          python3 scripts/test_check_cargo_audit_ci.py
          python3 scripts/test_classify_ci_changes.py
          python3 scripts/test_ci_workflow_policy.py

  rust-audit:
    name: Rust audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-audit
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-audit@0.22.1

      - name: Audit Rust dependencies
        # Cargo consumes --locked before dispatching to cargo-audit; cargo-audit
        # itself does not accept --locked after the subcommand.
        run: cargo --locked audit

  terminal-harness-installers:
    name: Terminal harness installer tests
    needs: changes
    if: needs.changes.outputs.ci_mode == 'full' && needs.changes.outputs.run_installers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Test Claude Code, Codex, Pi, OpenCode, and Goose installers
        run: |
          set -euo pipefail
          integrations/terminal-harness/tests/test_installer.sh claude
          integrations/terminal-harness/tests/test_installer.sh codex
          integrations/terminal-harness/tests/test_installer.sh pi
          integrations/terminal-harness/tests/test_installer.sh opencode
          integrations/terminal-harness/tests/test_installer.sh goose

  rust-wasm-check:
    name: Rust WASM check
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustup target add wasm32-unknown-unknown
          rustc --version
          cargo --version
          clang --version
          # Preflight the C toolchain before compiling ring for this target.
          clang --print-targets | grep wasm32

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Compile-only regression gate. Browser runtime behavior belongs in
      # downstream headless-browser acceptance tests.
      - name: Build browser WASM libraries
        env:
          CC_wasm32_unknown_unknown: clang
          RUSTFLAGS: -D warnings
        run: |
          cargo build --locked --target wasm32-unknown-unknown \
            -p cgka-traits \
            -p cgka-engine \
            -p transport-nostr-peeler

  rust-clippy:
    name: Rust check and clippy
    env:
      RUSTFLAGS: -D warnings
    needs: changes
    if: needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run clippy with all features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  c-smoke:
    name: C bindings smoke
    needs: changes
    if: needs.changes.outputs.ci_mode != 'precheck' && needs.changes.outputs.run_c == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install cbindgen
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cbindgen@0.29.4

      - name: Header diff gate
        run: |
          set -euo pipefail
          # Pin the exact version so a newer cbindgen can't reformat the
          # checked-in header and fail the diff gate on unrelated PRs.
          # RUSTC_BOOTSTRAP=1 lets cbindgen expand the mirror-generating
          # macros on stable; it only affects header generation.
          RUSTC_BOOTSTRAP=1 cbindgen --config crates/marmot-c/cbindgen.toml --crate marmot-c \
            --output crates/marmot-c/include/marmot.h crates/marmot-c
          git diff --exit-code crates/marmot-c/include/marmot.h

      - name: Alloc-audit tests
        run: cargo test -p marmot-c --features alloc-audit --locked

      - name: Compile and run debug C smoke test (gcc)
        run: ./crates/marmot-c/c-smoke.sh --debug gcc

  # Pull requests run this only with the `ci:apple` or `ci:full` label; merge
  # groups always run it, so it gates merging.
  ios-account-clippy:
    name: iOS account keychain clippy
    needs: changes
    if: >-
      needs.changes.outputs.run_ios == 'true'
      && (needs.changes.outputs.ci_mode != 'precheck' || needs.changes.outputs.apple_opt_in == 'true')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustup default "$toolchain"
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check iOS account keychain code
        run: cargo clippy -p marmot-account --target aarch64-apple-ios --locked -- -D warnings

  # The broader integration matrix explicitly enables test-policy-overrides.
  # This focused default-feature job proves ordinary debug/release consumers
  # reject every non-v1 convergence policy (mdk#970).
  convergence-policy-pin:
    name: Convergence policy pin (release assertions)
    needs: changes
    if: needs.changes.outputs.ci_mode != 'precheck' && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run default-build convergence policy pin tests
        # Keep in sync with `just test-convergence-policy-pin`.
        run: cargo test -p cgka-engine --test convergence_policy_pin --locked

  rust-test-build:
    name: Build workspace tests
    needs: changes
    # Pre-checks run no tests. Master pushes build test archives only to save
    # the Rust caches; the jobs that run them need the full mode.
    if: needs.changes.outputs.ci_mode != 'precheck'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          shared-key: rust-test

      - name: Verify workspace shard coverage
        run: bash scripts/check_ci_partitions.sh 7 --workspace --exclude cgka-conformance-simulator --features wn-cli/test-policy-overrides,cgka-engine/test-policy-overrides,cgka-engine/test-crash-hooks --locked --timings --profile ci -E "$WORKSPACE_FILTER"

      - name: Upload workspace compiler timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-compiler-timings
          path: target/cargo-timings/*.html
          overwrite: true
          retention-days: 7

      - name: Archive workspace tests
        run: cargo nextest archive --workspace --exclude cgka-conformance-simulator --features wn-cli/test-policy-overrides,cgka-engine/test-policy-overrides,cgka-engine/test-crash-hooks --locked --profile ci -E "$WORKSPACE_FILTER" --archive-file tests.tar.zst

      - name: Upload test archive
        if: needs.changes.outputs.ci_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-test
          path: tests.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  # Seven shards keep the slowest one near 20 minutes. Each shard's tests run
  # about four at a time, so its time tracks its total test time, and a slow
  # runner adds up to a quarter to that. Downloading the 2 GB test archive takes
  # anywhere from 20 seconds to 7 minutes on top. Five shards ran 15-28 minutes
  # and one was cancelled at the 30-minute limit.
  rust-test:
    name: Rust tests (${{ matrix.partition }}/7)
    needs: [changes, rust-test-build]
    if: needs.changes.outputs.ci_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Download test archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-test

      - name: Run workspace tests
        # The subprocess-heavy `wn-cli::cli` suite runs in its own
        # `cli-e2e` job so its fan-out never starves these fast unit tests
        # (issue #103). `relay_runtime` keeps its own serial job.
        run: cargo nextest run --archive-file tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --partition count:${{ matrix.partition }}/7 --no-tests=pass --profile ci -E "$WORKSPACE_FILTER"

  rust-test-extras:
    name: Doctests and diagnostic exporters
    needs: changes
    if: needs.changes.outputs.ci_mode != 'precheck' && needs.changes.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run doctests
        run: cargo test --workspace --exclude cgka-conformance-simulator --doc --locked

      - name: Test consent and both diagnostic exporters
        run: |
          cargo test -p marmot-app --features otlp-export,product-analytics-export --lib product_analytics:: --locked
          cargo test -p marmot-app --features otlp-export,product-analytics-export --lib backend_maintenance_collects --locked
          cargo test -p marmot-app --features otlp-export,product-analytics-export --test relay_telemetry_otlp --locked
          cargo test -p marmot-c --features otlp-export,product-analytics-export,alloc-audit product_analytics --locked
          cargo test -p agent-connector --features otlp-export,product-analytics-export usage_diagnostics:: --locked

  cli-e2e-build:
    name: Build CLI tests
    needs: changes
    if: needs.changes.outputs.ci_mode != 'precheck'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          shared-key: cli-e2e

      - name: Verify CLI shard coverage
        run: bash scripts/check_ci_partitions.sh 2 -p wn-cli --test cli --features test-policy-overrides --locked --profile ci -E 'all()'

      - name: Archive CLI tests
        run: cargo nextest archive -p wn-cli --test cli --features test-policy-overrides --locked --profile ci --archive-file tests.tar.zst

      - name: Upload test archive
        if: needs.changes.outputs.ci_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-e2e
          path: tests.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  cli-e2e:
    name: CLI e2e (mock relay, ${{ matrix.partition }}/2)
    needs: [changes, cli-e2e-build]
    if: needs.changes.outputs.ci_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Download test archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-e2e

      - name: Run CLI end-to-end tests
        # Dedicated job: this subprocess-heavy suite is capped by the `cli-e2e`
        # test-group and the `ci` profile adds retries + a hung-test backstop.
        # The real-relay test self-skips here; it has its own `Relay CLI E2E`
        # job with a docker relay stack.
        run: cargo nextest run --archive-file tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --partition count:${{ matrix.partition }}/2 --profile ci

  relay-runtime-build:
    name: Build relay runtime tests
    needs: changes
    if: needs.changes.outputs.ci_mode != 'precheck'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          shared-key: relay-runtime

      - name: Verify relay runtime shard coverage
        run: bash scripts/check_ci_partitions.sh 2 -p marmot-app --test relay_runtime --test startup_hydration --features test-policy-overrides --locked --profile ci -E 'binary(relay_runtime)'

      - name: Archive relay runtime tests
        run: cargo nextest archive -p marmot-app --test relay_runtime --test startup_hydration --features test-policy-overrides --locked --profile ci --archive-file tests.tar.zst

      - name: Upload test archive
        if: needs.changes.outputs.ci_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-runtime
          path: tests.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  relay-runtime:
    name: Relay runtime tests (${{ matrix.partition }}/2)
    needs: [changes, relay-runtime-build]
    if: needs.changes.outputs.ci_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Download test archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: relay-runtime

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cargo-nextest@0.9.132

      - name: Run relay runtime tests serially
        # Preserve the former cargo-test lane's no-retry behavior.
        env:
          RUST_BACKTRACE: "1"
        run: cargo nextest run --archive-file tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --profile ci --retries 0 --test-threads 1 --partition count:${{ matrix.partition }}/2 -E 'binary(relay_runtime)'

      - name: Run held peer-index upgrade lookup
        if: matrix.partition == 1
        run: cargo nextest run --archive-file tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE" --profile default --retries 0 -E 'binary(startup_hydration) & test(=existing_direct_conversation_is_not_a_miss_while_upgrade_backfill_is_held)'

  relay-e2e:
    name: Relay CLI E2E
    needs: [changes, cli-e2e-build]
    if: needs.changes.outputs.ci_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Download test archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli-e2e

      - name: Start local relay stack
        run: docker compose up -d setup nostr-rs-relay strfry-nostr-relay

      - name: Wait for local relays
        run: |
          docker compose ps
          ./scripts/wait_for_relays.sh

      - name: Run real relay CLI E2E
        env:
          MDK_E2E_REQUIRE_RELAYS: "1"
        run: cargo nextest run --archive-file tests.tar.zst --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --profile ci -E 'test(=real_local_relays_deliver_cli_messages_over_sdk_path)'

      - name: Dump local relay logs
        if: failure()
        run: docker compose logs nostr-rs-relay strfry-nostr-relay || true

      - name: Stop local relay stack
        if: always()
        run: docker compose down -v

  conformance-build:
    name: Build simulator tests
    needs: changes
    if: needs.changes.outputs.ci_mode != 'precheck'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Install just
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # just
        with:
          tool: just

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          shared-key: simulator-tests

      - name: Verify simulator smoke shard coverage
        run: bash scripts/check_ci_partitions.sh 2 -p cgka-conformance-simulator --locked --profile ci -E "$(just --evaluate simulator-smoke-filter) and not binary(offline_catchup_regression)"

      - name: Archive default-feature simulator tests
        run: cargo nextest archive -p cgka-conformance-simulator --locked --profile ci --archive-file simulator.tar.zst

      - name: Upload simulator test archive
        if: needs.changes.outputs.ci_mode == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simulator-tests
          path: simulator.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  conformance:
    name: Simulator and vectors (${{ matrix.lane }})
    needs: [changes, conformance-build]
    if: needs.changes.outputs.ci_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Three jobs, balanced by measured runtime, keep this matrix off the
      # critical path while holding fewer of the organization's runner slots.
      matrix:
        include:
          - lane: offline-history
            groups: offline-history
          - lane: smoke-1, models
            groups: smoke-1 models
          - lane: smoke-2, process
            groups: smoke-2 process

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Install just
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # just
        with:
          tool: just

      - name: Download simulator test archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: simulator-tests

      - name: Extract simulator test binaries
        run: cargo nextest list --archive-file simulator.tar.zst --extract-to "$GITHUB_WORKSPACE" --workspace-remap "$GITHUB_WORKSPACE" --list-type binaries-only > /dev/null

      - name: Run archived simulator tests
        env:
          SIM_GROUPS: ${{ matrix.groups }}
        run: |
          set -euo pipefail
          nextest=(cargo nextest run
            --cargo-metadata target/nextest/cargo-metadata.json
            --binaries-metadata target/nextest/binaries-metadata.json
            --workspace-remap "$GITHUB_WORKSPACE"
            --target-dir-remap "$GITHUB_WORKSPACE/target")
          # Callers run each group under `||`, where errexit is suspended, so
          # every group returns its own status and the models loop collects it.
          run_group() {
            case "$1" in
              smoke-*)
                "${nextest[@]}" --profile ci --partition "count:${1#smoke-}/2" \
                  -E "$(just --evaluate simulator-smoke-filter) and not binary(offline_catchup_regression)"
                ;;
              offline-history)
                "${nextest[@]}" --profile ci -E 'binary(=offline_catchup_regression)'
                ;;
              process)
                "${nextest[@]}" --profile ci \
                  -E "binary(=process_orchestrator) and ($(just --evaluate simulator-process-filter))"
                ;;
              models)
                local status=0
                for binary in route_assurance independent_reference_model lifecycle_model mutation_adequacy protocol_decision_gate semantic_reduction; do
                  "${nextest[@]}" --profile ci -E "binary(=$binary)" || status=1
                done
                return "$status"
                ;;
              *) return 2 ;;
            esac
          }
          # Run every group even after a failure so one job reports all of them.
          failed=()
          for group in $SIM_GROUPS; do
            run_group "$group" || failed+=("$group")
          done
          if (( ${#failed[@]} )); then
            echo "error: simulator groups failed: ${failed[*]}" >&2
            exit 1
          fi

  conformance-extras:
    name: Convergence gates and simulator doctests
    needs: changes
    if: needs.changes.outputs.ci_mode != 'precheck'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Install just
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # just
        with:
          tool: just

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Validate convergence execution-lane policy
        run: just convergence-lane-policy

      - name: Validate convergence failure-corpus lifecycle
        run: cargo nextest run -p convergence-campaign-runner --test failure_corpus --locked

      - name: Run focused convergence regressions
        run: just focused-convergence-regressions

      - name: Run simulator doctests
        run: cargo test -p cgka-conformance-simulator --doc --locked

      - name: Verify TLA liveness and counterexample
        run: just tla-liveness tla-liveness-counterexample

  formal:
    name: Tamarin proofs
    needs: changes
    if: needs.changes.outputs.ci_mode == 'full' && needs.changes.outputs.run_formal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Tamarin dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=15s 180s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "apt-get update failed after $attempt attempts" >&2
              exit 1
            fi
            echo "apt-get update attempt $attempt failed; retrying" >&2
          done
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            install -y --no-install-recommends graphviz maude

      - name: Install Tamarin
        env:
          TAMARIN_VERSION: 1.12.0
        run: |
          set -euo pipefail
          curl -L --fail --show-error --silent \
            "https://github.com/tamarin-prover/tamarin-prover/releases/download/${TAMARIN_VERSION}/tamarin-prover-${TAMARIN_VERSION}-linux64-ubuntu.tar.gz" \
            -o /tmp/tamarin-prover.tar.gz
          tar -xzf /tmp/tamarin-prover.tar.gz -C /tmp
          sudo install -m 0755 /tmp/tamarin-prover /usr/local/bin/tamarin-prover
          tamarin-prover --version

      - name: Run Tamarin proofs
        run: make -C formal/tamarin prove

  hermes-installer-auth:
    name: Hermes installer auth
    needs: changes
    if: needs.changes.outputs.ci_mode == 'full' && needs.changes.outputs.run_hermes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install system dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          venv_check_dir="${RUNNER_TEMP}/hermes-venv-check"
          if command -v python3 >/dev/null \
            && command -v git >/dev/null \
            && python3 -m venv "$venv_check_dir"; then
            rm -rf "$venv_check_dir"
            exit 0
          fi
          rm -rf "$venv_check_dir"
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=15s 180s apt-get \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              update; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "apt-get update failed after $attempt attempts" >&2
              exit 1
            fi
            echo "apt-get update attempt $attempt failed; retrying" >&2
          done
          sudo apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o DPkg::Lock::Timeout=60 \
            install -y --no-install-recommends python3 python3-venv git

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Hermes Python unit tests
        timeout-minutes: 3
        run: |
          set -euo pipefail
          uv venv "$RUNNER_TEMP/hermes-doctor-oracle"
          uv pip install --python "$RUNNER_TEMP/hermes-doctor-oracle/bin/python" python-dotenv==1.2.2
          env -i HOME="$HOME" PATH="$PATH" USER="${USER:-runner}" \
            "$RUNNER_TEMP/hermes-doctor-oracle/bin/python" -c 'import faulthandler, unittest; faulthandler.dump_traceback_later(120, exit=True); unittest.main(module=None)' discover -s integrations/hermes/tests/marmot -v

      - name: Prepare isolated Hermes environment for authorization E2E
        run: |
          set -euo pipefail
          ./scripts/hermes_marmot_dev_setup.sh \
            --root "$RUNNER_TEMP/hermes-installer-auth" \
            --install-pinned-wheel

      - name: Pinned Hermes approval host contract
        timeout-minutes: 3
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/hermes-installer-auth/env.sh"
          HERMES_APPROVAL_CONTRACT=1 PYTHONPATH="$HERMES_AGENT_REPO" \
            "$HERMES_AGENT_REPO/.venv/bin/python" -m unittest discover \
            -s integrations/hermes/tests/marmot -p test_approval_host_contract.py -v

      - name: Hermes installer unit and mock regressions
        run: |
          set -euo pipefail
          bash -n scripts/install-hermes-marmot.sh
          bash -n integrations/hermes/tests/marmot/test_installer_env.sh
          bash -n scripts/hermes_marmot_deterministic_e2e.sh
          python3 -m py_compile scripts/hermes_marmot_configure_gateway.py integrations/hermes/tests/marmot/e2e_gateway_auth.py
          integrations/hermes/tests/marmot/test_dev_scripts.sh

      - name: Pinned Hermes presence host contracts
        timeout-minutes: 3
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/hermes-installer-auth/env.sh"
          HERMES_PRESENCE_CONTRACT=1 PYTHONPATH="$HERMES_AGENT_REPO" \
            "$HERMES_AGENT_REPO/.venv/bin/python" -m unittest discover \
            -s integrations/hermes/tests/marmot -p test_presence_host_contract.py -v

      - name: Real Hermes authorization and deterministic Marmot E2E
        # About 10 s of work; bound a hang well inside the job's 30 minutes.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # The deterministic runner sources the pinned dev root, runs
          # test_installer_env.sh against its real GatewayRunner, then runs the
          # adapter E2E. A missing Hermes venv is a hard failure, not a skip.
          ./scripts/hermes_marmot_deterministic_e2e.sh --root "$RUNNER_TEMP/hermes-installer-auth"

  # Platform-neutral workspace dependencies reach this code too, so every full
  # run includes it rather than a Windows path filter.
  windows-filesystem:
    name: Windows filesystem contracts
    needs: changes
    if: needs.changes.outputs.ci_mode != 'precheck'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5 # nextest
        with:
          tool: cargo-nextest@0.9.132

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # The Windows code lives in fs-private, account file replacement and
      # local audit delivery, and is covered by those crates' unit tests,
      # marmot-account's home tests and marmot-forensics' audit tests.
      # marmot-account's runtime binary is excluded: its publish, fanout and
      # maintenance scenarios are platform-neutral, run on Linux CI, and took
      # over 30 minutes here.
      - name: Test filesystem, account replacement, and audit delivery
        run: >-
          cargo nextest run --locked -p fs-private -p marmot-account -p marmot-forensics
          -E 'not (package(marmot-account) & binary(runtime))'

      - name: Test runtime root ownership
        run: >-
          cargo nextest run --locked -p marmot-app --lib
          -E 'test(root_runtime_lease)'

  required-ci:
    name: Required CI
    if: always()
    needs:
      - changes
      - rust-format
      - rust-audit
      - terminal-harness-installers
      - rust-wasm-check
      - rust-clippy
      - c-smoke
      - ios-account-clippy
      - convergence-policy-pin
      - rust-test-build
      - rust-test
      - rust-test-extras
      - cli-e2e-build
      - cli-e2e
      - relay-runtime-build
      - relay-runtime
      - relay-e2e
      - conformance-build
      - conformance
      - conformance-extras
      - formal
      - hermes-installer-auth
      - windows-filesystem
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # A full run selects every job, so a skip there means a broken condition
      # rather than an unaffected lane. Merge groups must be full runs.
      - name: Require every selected core CI job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          CI_MODE: ${{ needs.changes.outputs.ci_mode }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if [[ "$EVENT_NAME" == merge_group && "$CI_MODE" != full ]]; then
            echo "error: merge group selected CI mode '$CI_MODE', not full" >&2
            exit 1
          fi
          accepted='["success", "skipped"]'
          if [[ "$CI_MODE" == full ]]; then accepted='["success"]'; fi
          jq --exit-status --argjson accepted "$accepted" 'all(.[]; .result | IN($accepted[]))' <<<"$NEEDS"
