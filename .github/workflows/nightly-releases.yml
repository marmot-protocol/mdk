name: Nightly Releases

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact candidate commit to rehearse
        required: true
        type: string
      build_only:
        description: Confirm this is a non-publishing rehearsal
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  marmotkit:
    name: MarmotKit
    if: inputs.build_only == true
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/bindings.yaml
    with:
      source_sha: ${{ inputs.source_sha }}
      build_only: true
      nightly_version: ""

  marmotc:
    name: Marmot C
    if: inputs.build_only == true
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/c-bindings.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      build_only: true
      nightly_version: 0.15.0-nightly.20261108

  wn-agent:
    name: wn-agent
    if: inputs.build_only == true
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/wn-agent-binaries.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      build_only: true
      nightly_version: 0.15.0-nightly.20261108
