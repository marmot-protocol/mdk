name: MarmotKit Release Profile

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/bindings-profile.yml
      - .github/workflows/bindings-profile-measurement.yml
      - .github/workflows/bindings.yaml
      - crates/marmot-uniffi/**
      - "!crates/marmot-uniffi/*.md"
      - "!crates/marmot-uniffi/**/*.md"
  push:
    branches:
      - master
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/bindings-profile.yml
      - .github/workflows/bindings-profile-measurement.yml
      - .github/workflows/bindings.yaml
      - crates/marmot-uniffi/**
      - "!crates/marmot-uniffi/*.md"
      - "!crates/marmot-uniffi/**/*.md"
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marmotkit-profile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  ANDROID_NDK_VERSION: 27.2.12479018
  OTLP_EXPORT: "1"
  PRODUCT_ANALYTICS_EXPORT: "1"

jobs:
  identity:
    name: Resolve exact candidate identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      builder_sha: ${{ steps.identity.outputs.builder_sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact candidate identity
        id: identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ || "$source_sha" != "$EXPECTED_SHA" ]]; then
            echo "error: checkout did not resolve the exact requested candidate SHA" >&2
            exit 1
          fi
          {
            echo "source_sha=$source_sha"
            echo "builder_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Run inexpensive orchestration regressions
        run: |
          set -euo pipefail
          python3 crates/marmot-uniffi/test-release-profile.py
          python3 crates/marmot-uniffi/test-build-phases.py
          python3 crates/marmot-uniffi/test-apple-privacy.py
          python3 crates/marmot-uniffi/test-android-artifact.py

  apple-build:
    name: Build Apple candidate input (${{ matrix.part }})
    runs-on: macos-latest
    needs: identity
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - part: swift
            path: crates/marmot-uniffi/build/ios/swift
            provenance: crates/marmot-uniffi/build/ios/swift/build-provenance.json
          - part: macos
            path: target/aarch64-apple-darwin/release/libmarmot_uniffi.a
            provenance: target/aarch64-apple-darwin/release/build-provenance.json
          - part: ios-simulator
            path: target/aarch64-apple-ios-sim/release/libmarmot_uniffi.a
            provenance: target/aarch64-apple-ios-sim/release/build-provenance.json
          - part: ios-device
            path: target/aarch64-apple-ios/release/libmarmot_uniffi.a
            provenance: target/aarch64-apple-ios/release/build-provenance.json
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.source_sha }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version
          xcodebuild -version
      - name: Restore trusted Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          shared-key: marmotkit-profile-${{ matrix.part }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/marmot-uniffi/marmotkit-*.env', 'crates/marmot-uniffi/*framework*.sh') }}
      - name: Verify native archive reconstruction and linking
        if: matrix.part == 'swift'
        run: |
          rustup component add llvm-tools-preview
          python3 crates/marmot-uniffi/test-native-archive.py
      - name: Build one Apple candidate input
        env:
          PART: ${{ matrix.part }}
          BUILDER_SHA: ${{ needs.identity.outputs.builder_sha }}
          PROVENANCE_PATH: ${{ matrix.provenance }}
          MARMOTKIT_WORKSPACE_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          case "$PART" in
            swift) ./crates/marmot-uniffi/xcframework.sh generate ;;
            ios-device) ./crates/marmot-uniffi/xcframework.sh native aarch64-apple-ios ;;
            ios-simulator) ./crates/marmot-uniffi/xcframework.sh native aarch64-apple-ios-sim ;;
            macos) ./crates/marmot-uniffi/xcframework-macos.sh native ;;
            *) exit 1 ;;
          esac
          python3 crates/marmot-uniffi/build-provenance.py record "$PART" "$PROVENANCE_PATH"
      - name: Upload exact-head Apple input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-input-${{ matrix.part }}-${{ needs.identity.outputs.source_sha }}
          path: |
            ${{ matrix.path }}
            ${{ matrix.provenance }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Upload Apple build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-diagnostics-${{ matrix.part }}-${{ needs.identity.outputs.source_sha }}
          path: |
            target/cargo-timings/*.html
            ${{ matrix.provenance }}
          if-no-files-found: warn
          retention-days: 7

  android-build:
    name: Build Android candidate input (${{ matrix.part }})
    runs-on: ubuntu-latest
    needs: identity
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: kotlin
            target: ""
          - part: arm64-v8a
            target: aarch64-linux-android
          - part: armeabi-v7a
            target: armv7-linux-androideabi
          - part: x86
            target: i686-linux-android
          - part: x86_64
            target: x86_64-linux-android
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.source_sha }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustc --version
          cargo --version
      - name: Install native target
        if: matrix.part != 'kotlin'
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Install Android NDK
        if: matrix.part != 'kotlin'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "error: ANDROID_SDK_ROOT or ANDROID_HOME must be set on the runner" >&2
            exit 1
          fi
          sdkmanager_bin=""
          for candidate in \
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk_root/cmdline-tools/bin/sdkmanager" \
            "$sdk_root/tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [[ -z "$sdkmanager_bin" ]] && command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "error: sdkmanager not found under $sdk_root" >&2
            find "$sdk_root" -maxdepth 4 -type f -name sdkmanager -print >&2 || true
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_bin" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Restore trusted Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
          shared-key: marmotkit-profile-${{ matrix.part }}
          key: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'crates/marmot-uniffi/marmotkit-*.env', 'crates/marmot-uniffi/kotlin-bindings.sh') }}
      - name: Build one Android candidate input
        env:
          PART: ${{ matrix.part }}
          BUILDER_SHA: ${{ needs.identity.outputs.builder_sha }}
          MARMOTKIT_WORKSPACE_DIR: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [[ "$PART" == kotlin ]]; then
            ./crates/marmot-uniffi/kotlin-bindings.sh generate
          else
            ANDROID_ABIS="$PART" ./crates/marmot-uniffi/kotlin-bindings.sh native
          fi
          python3 crates/marmot-uniffi/build-provenance.py record "$PART" \
            "crates/marmot-uniffi/output/android/provenance/$PART.json"
      - name: Upload exact-head Android input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-input-android-${{ matrix.part }}-${{ needs.identity.outputs.source_sha }}
          path: crates/marmot-uniffi/output/android
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-diagnostics-android-${{ matrix.part }}-${{ needs.identity.outputs.source_sha }}
          path: |
            target/cargo-timings/*.html
            crates/marmot-uniffi/output/android/provenance/${{ matrix.part }}.json
          if-no-files-found: warn
          retention-days: 7

  android-package:
    name: Validate Android candidate package
    runs-on: ubuntu-latest
    needs: [identity, android-build]
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.source_sha }}
      - name: Download same-run Android inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: marmotkit-profile-input-android-*-${{ needs.identity.outputs.source_sha }}
          merge-multiple: true
          path: crates/marmot-uniffi/output/android
      - name: Verify exact-head Android provenance
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          BUILDER_SHA: ${{ needs.identity.outputs.builder_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 crates/marmot-uniffi/build-provenance.py verify android \
            --artifact-root crates/marmot-uniffi/output/android \
            crates/marmot-uniffi/output/android/provenance/*.json
      - name: Assemble and validate Android candidate package
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          BUILDER_SHA: ${{ needs.identity.outputs.builder_sha }}
        run: |
          set -euo pipefail
          root="crates/marmot-uniffi/output/android"
          required=(
            kotlin/dev/ipf/marmotkit/marmot_uniffi.kt
            kotlin/dev/ipf/marmotkit/MarmotAndroid.kt
            kotlin/io/crates/keyring/Keyring.kt
            jniLibs/arm64-v8a/libmarmot_uniffi.so
            jniLibs/armeabi-v7a/libmarmot_uniffi.so
            jniLibs/x86/libmarmot_uniffi.so
            jniLibs/x86_64/libmarmot_uniffi.so
          )
          for path in "${required[@]}"; do
            [[ -s "$root/$path" ]] || { echo "error: missing Android candidate input: $path" >&2; exit 1; }
          done
          stage="$RUNNER_TEMP/marmotkit-android-$SOURCE_SHA"
          mkdir -p "$stage" "$RUNNER_TEMP/marmotkit-profile-android"
          cp -R "$root/kotlin" "$root/jniLibs" "$root/provenance" "$stage/"
          python3 crates/marmot-uniffi/validate-android-artifact.py directory \
            "$stage" --report "$stage/android-elf.json"
          {
            echo "source_sha=$SOURCE_SHA"
            echo "builder_sha=$BUILDER_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            for path in "${required[@]}"; do sha256sum "$root/$path"; done
          } > "$stage/manifest.txt"
          (cd "$RUNNER_TEMP" && zip -qr "marmotkit-profile-android/$SOURCE_SHA.zip" "marmotkit-android-$SOURCE_SHA")
          python3 crates/marmot-uniffi/validate-android-artifact.py bundle \
            "$RUNNER_TEMP/marmotkit-profile-android/$SOURCE_SHA.zip" \
            --root "marmotkit-android-$SOURCE_SHA" \
            --report "$stage/android-elf.json"
          sha256sum "$RUNNER_TEMP/marmotkit-profile-android/$SOURCE_SHA.zip" \
            > "$RUNNER_TEMP/marmotkit-profile-android/$SOURCE_SHA.zip.sha256"
      - name: Upload Android candidate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-android-${{ needs.identity.outputs.source_sha }}
          path: ${{ runner.temp }}/marmotkit-profile-android
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android package diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-diagnostics-android-package-${{ needs.identity.outputs.source_sha }}
          path: |
            crates/marmot-uniffi/output/android/provenance
            ${{ runner.temp }}/marmotkit-profile-android
          if-no-files-found: warn
          retention-days: 7

  ios-package:
    name: Assemble and validate iOS candidate
    runs-on: macos-latest
    needs: [identity, apple-build]
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.source_sha }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustup component add llvm-tools-preview
          rustc --version
          cargo --version
          xcodebuild -version
      - name: Download same-run Swift input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: marmotkit-profile-input-swift-${{ needs.identity.outputs.source_sha }}
          path: crates/marmot-uniffi/build/ios/swift
      - name: Download same-run iOS device input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: marmotkit-profile-input-ios-device-${{ needs.identity.outputs.source_sha }}
          path: target/aarch64-apple-ios/release
      - name: Download same-run iOS simulator input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: marmotkit-profile-input-ios-simulator-${{ needs.identity.outputs.source_sha }}
          path: target/aarch64-apple-ios-sim/release
      - name: Verify exact-head iOS provenance
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          BUILDER_SHA: ${{ needs.identity.outputs.builder_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 crates/marmot-uniffi/build-provenance.py verify ios \
            crates/marmot-uniffi/build/ios/swift/build-provenance.json \
            target/aarch64-apple-ios/release/build-provenance.json \
            target/aarch64-apple-ios-sim/release/build-provenance.json
      - name: Sanitize and assemble iOS XCFramework
        run: ./crates/marmot-uniffi/xcframework.sh assemble
      - name: Package and validate iOS candidate
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          BUILDER_SHA: ${{ needs.identity.outputs.builder_sha }}
        run: |
          set -euo pipefail
          release_id="profile-$SOURCE_SHA"
          dist="$RUNNER_TEMP/marmotkit-profile-ios"
          mkdir -p "$dist"
          ./crates/marmot-uniffi/package-ios-artifacts.sh \
            "$release_id" "candidate-$SOURCE_SHA" "$SOURCE_SHA" "$dist" "$BUILDER_SHA"
          ./crates/marmot-uniffi/validate-ios-artifact.sh \
            "$dist/MarmotKitFFI-$release_id.xcframework.zip" "$IPHONEOS_DEPLOYMENT_TARGET"
          ./crates/marmot-uniffi/validate-swift-package.sh \
            crates/marmot-uniffi/output/MarmotKit.xcframework - \
            crates/marmot-uniffi/output/MarmotKit.swift "$RUNNER_TEMP/marmotkit-profile-ios-consumer"
          command -v xcodegen >/dev/null || brew install xcodegen
          python3 crates/marmot-uniffi/validate-apple-archive.py ios \
            "$dist/MarmotKitFFI-$release_id.xcframework.zip" "$dist/MarmotKit-$release_id.swift" \
            "$RUNNER_TEMP/marmotkit-profile-ios-privacy-archive" \
            --privacy-manifest "$dist/PrivacyInfo-ios-$release_id.xcprivacy" \
            --release-manifest "$dist/marmotkit-ios-$release_id.manifest.json" \
            --privacy-dir crates/marmot-uniffi/apple-privacy \
            --product-analytics "$PRODUCT_ANALYTICS_EXPORT"
      - name: Upload iOS candidate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-ios-${{ needs.identity.outputs.source_sha }}
          path: ${{ runner.temp }}/marmotkit-profile-ios
          if-no-files-found: error
          retention-days: 7
      - name: Upload iOS package diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-diagnostics-ios-package-${{ needs.identity.outputs.source_sha }}
          path: |
            target/aarch64-apple-ios/release/build-provenance.json
            target/aarch64-apple-ios-sim/release/build-provenance.json
            ${{ runner.temp }}/marmotkit-profile-ios
          if-no-files-found: warn
          retention-days: 7

  macos-package:
    name: Assemble and validate macOS candidate
    runs-on: macos-latest
    needs: [identity, apple-build]
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.source_sha }}
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustup component add llvm-tools-preview
          rustc --version
          cargo --version
          xcodebuild -version
      - name: Download same-run Swift input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: marmotkit-profile-input-swift-${{ needs.identity.outputs.source_sha }}
          path: crates/marmot-uniffi/build/macos/swift
      - name: Download same-run macOS input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: marmotkit-profile-input-macos-${{ needs.identity.outputs.source_sha }}
          path: target/aarch64-apple-darwin/release
      - name: Verify exact-head macOS provenance
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          BUILDER_SHA: ${{ needs.identity.outputs.builder_sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 crates/marmot-uniffi/build-provenance.py verify macos \
            crates/marmot-uniffi/build/macos/swift/build-provenance.json \
            target/aarch64-apple-darwin/release/build-provenance.json
      - name: Sanitize and assemble macOS XCFramework
        run: ./crates/marmot-uniffi/xcframework-macos.sh assemble
      - name: Package and validate macOS candidate
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          BUILDER_SHA: ${{ needs.identity.outputs.builder_sha }}
        run: |
          set -euo pipefail
          release_id="profile-$SOURCE_SHA"
          dist="$RUNNER_TEMP/marmotkit-profile-macos"
          mkdir -p "$dist"
          ./crates/marmot-uniffi/package-macos-artifacts.sh \
            "$release_id" "candidate-$SOURCE_SHA" "$SOURCE_SHA" "$dist" "$BUILDER_SHA"
          ./crates/marmot-uniffi/validate-macos-artifact.sh \
            "$dist/MarmotKitFFI-macos-$release_id.xcframework.zip" "$MACOSX_DEPLOYMENT_TARGET"
          ./crates/marmot-uniffi/validate-swift-package-macos.sh \
            crates/marmot-uniffi/output/macos/MarmotKit.xcframework - \
            crates/marmot-uniffi/output/macos/MarmotKit.swift "$RUNNER_TEMP/marmotkit-profile-macos-consumer"
          command -v xcodegen >/dev/null || brew install xcodegen
          cp crates/marmot-uniffi/output/macos/MarmotKit.swift "$RUNNER_TEMP/MarmotKit-$release_id.swift"
          python3 crates/marmot-uniffi/validate-apple-archive.py macos \
            "$dist/MarmotKitFFI-macos-$release_id.xcframework.zip" "$RUNNER_TEMP/MarmotKit-$release_id.swift" \
            "$RUNNER_TEMP/marmotkit-profile-macos-privacy-archive" \
            --privacy-manifest "$dist/PrivacyInfo-macos-$release_id.xcprivacy" \
            --release-manifest "$dist/marmotkit-macos-$release_id.manifest.json" \
            --privacy-dir crates/marmot-uniffi/apple-privacy \
            --product-analytics "$PRODUCT_ANALYTICS_EXPORT"
      - name: Upload macOS candidate package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-macos-${{ needs.identity.outputs.source_sha }}
          path: ${{ runner.temp }}/marmotkit-profile-macos
          if-no-files-found: error
          retention-days: 7
      - name: Upload macOS package diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-diagnostics-macos-package-${{ needs.identity.outputs.source_sha }}
          path: |
            target/aarch64-apple-darwin/release/build-provenance.json
            ${{ runner.temp }}/marmotkit-profile-macos
          if-no-files-found: warn
          retention-days: 7

  candidate-validation:
    name: MarmotKit exact-head packaging
    runs-on: ubuntu-latest
    needs: [identity, android-package, ios-package, macos-package]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every candidate package
        env:
          IDENTITY_RESULT: ${{ needs.identity.result }}
          ANDROID_RESULT: ${{ needs.android-package.result }}
          IOS_RESULT: ${{ needs.ios-package.result }}
          MACOS_RESULT: ${{ needs.macos-package.result }}
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          for result in "$IDENTITY_RESULT" "$ANDROID_RESULT" "$IOS_RESULT" "$MACOS_RESULT"; do
            [[ "$result" == success ]] || exit 1
          done
          echo "Validated Android, iOS, and macOS candidate packages for $SOURCE_SHA"
