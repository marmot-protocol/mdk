name: wn-agent Binaries

on:
  pull_request:
    paths:
      - .github/workflows/wn-agent-binaries.yml
      - scripts/install-hermes-marmot.sh
      - scripts/hermes_marmot_configure_gateway.py
      - scripts/hermes_marmot_dev_setup.sh
      - scripts/hermes_marmot_verify_persisted_config.sh
      - integrations/hermes/marmot/**
      - scripts/install-openclaw-marmot.sh
      - integrations/openclaw/marmot/**
      - scripts/install-codex-marmot.sh
      - integrations/codex/marmot/**
      - scripts/install-opencode-marmot.sh
      - integrations/opencode/marmot/**
      - scripts/install-pi-marmot.sh
      - scripts/install-terminal-harness-marmot.sh
      - scripts/package-binary-bundle.sh
      - integrations/pi/marmot/**
      - integrations/terminal-harness/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - crates/agent-connector/**
      - crates/agent-control/**
      - crates/agent-stream-compose/**
      - crates/cgka-engine/**
      - crates/cgka-session/**
      - crates/marmot-account/**
      - crates/marmot-app/**
      - crates/storage-sqlite/**
      - crates/traits/**
      - crates/transport-nostr-adapter/**
      - crates/transport-nostr-peeler/**
      - crates/transport-quic-broker/**
      - crates/transport-quic-stream/**
  push:
    branches:
      - master
    tags:
      - wn-agent-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wn-agent-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  build:
    name: Build wn-agent and terminal harnesses (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: darwin-aarch64
            rust_target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: darwin-x86_64
            rust_target: x86_64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --target "${{ matrix.rust_target }}"
          rustup default "$toolchain"
          rustc --version
          cargo --version

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build wn-agent
        run: cargo build --locked --release -p agent-connector --bin wn-agent --target "${{ matrix.rust_target }}"

      - name: Smoke test wn-agent
        run: ./target/${{ matrix.rust_target }}/release/wn-agent --help

      - name: Build wn-codex
        run: cargo build --locked --release -p wn-codex --bin wn-codex --target "${{ matrix.rust_target }}"

      - name: Smoke test wn-codex
        run: ./target/${{ matrix.rust_target }}/release/wn-codex --help

      - name: Build wn-opencode
        run: cargo build --locked --release -p wn-opencode --bin wn-opencode --target "${{ matrix.rust_target }}"

      - name: Smoke test wn-opencode
        run: ./target/${{ matrix.rust_target }}/release/wn-opencode --help

      - name: Build wn-pi
        run: cargo build --locked --release -p wn-pi --bin wn-pi --target "${{ matrix.rust_target }}"

      - name: Smoke test wn-pi
        run: ./target/${{ matrix.rust_target }}/release/wn-pi --help

      - name: Package binary bundles
        shell: bash
        run: |
          set -euo pipefail
          for binary in wn-agent wn-codex wn-opencode wn-pi; do
            ./scripts/package-binary-bundle.sh \
              "$binary" \
              "${{ matrix.target }}" \
              "${{ matrix.rust_target }}"
          done

      - name: Upload wn-agent bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wn-agent-${{ matrix.target }}
          path: dist/wn-agent-${{ matrix.target }}/*
          if-no-files-found: error

      - name: Upload wn-codex bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wn-codex-${{ matrix.target }}
          path: dist/wn-codex-${{ matrix.target }}/*
          if-no-files-found: error

      - name: Upload wn-opencode bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wn-opencode-${{ matrix.target }}
          path: dist/wn-opencode-${{ matrix.target }}/*
          if-no-files-found: error

      - name: Upload wn-pi bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wn-pi-${{ matrix.target }}
          path: dist/wn-pi-${{ matrix.target }}/*
          if-no-files-found: error

  plugin:
    name: Package Hermes plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Package Hermes Marmot plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          sha_short="${GITHUB_SHA::12}"
          workspace_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          release_tag=""
          artifact_version="$sha_short"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
            if [[ ! "$release_tag" =~ ^wn-agent-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "error: wn-agent releases must use a version tag like wn-agent-v0.1.0" >&2
              exit 1
            fi
            artifact_version="${release_tag#wn-agent-v}"
            if [ "$artifact_version" != "$workspace_version" ]; then
              echo "error: wn-agent release version $artifact_version does not match workspace version $workspace_version" >&2
              exit 1
            fi
          fi
          stage_parent="$RUNNER_TEMP/hermes-marmot-plugin-stage"
          bundle_dir="$stage_parent/hermes-marmot-plugin"
          asset="$RUNNER_TEMP/hermes-marmot-plugin-$artifact_version.tar.gz"

          rm -rf "$stage_parent" "$asset" "$asset.sha256"
          mkdir -p "$bundle_dir"
          sed -e "s/^version:.*/version: $artifact_version/" \
            integrations/hermes/marmot/plugin.yaml > "$bundle_dir/plugin.yaml"
          if ! grep -qx "version: $artifact_version" "$bundle_dir/plugin.yaml"; then
            echo "error: packaged Hermes plugin metadata did not get version $artifact_version" >&2
            exit 1
          fi
          cp integrations/hermes/marmot/__init__.py "$bundle_dir/"
          cp integrations/hermes/marmot/adapter.py "$bundle_dir/"
          cp integrations/hermes/marmot/README.md "$bundle_dir/"
          cp scripts/hermes_marmot_configure_gateway.py "$bundle_dir/configure_gateway.py"

          cat > "$bundle_dir/manifest.json" <<EOF
          {
            "name": "hermes-marmot-plugin",
            "release_tag": "$release_tag",
            "artifact_version": "$artifact_version",
            "source_sha": "$GITHUB_SHA",
            "workspace_version": "$workspace_version",
            "contents": [
              "plugin.yaml",
              "__init__.py",
              "adapter.py",
              "configure_gateway.py",
              "README.md",
              "manifest.json"
            ]
          }
          EOF

          (
            cd "$stage_parent"
            tar -czf "$asset" "hermes-marmot-plugin"
          )
          shasum -a 256 "$asset" | awk -v name="$(basename "$asset")" '{print $1 "  " name}' > "$asset.sha256"
          mkdir -p dist/hermes-marmot-plugin
          cp "$asset" "$asset.sha256" dist/hermes-marmot-plugin/

      - name: Upload Hermes plugin bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-marmot-plugin
          path: dist/hermes-marmot-plugin/*
          if-no-files-found: error

  hermes-marmot-integration:
    name: Hermes Marmot persisted config
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Run Hermes Marmot unit tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s integrations/hermes/marmot/tests

      - name: Run Hermes dev-script smoke test
        run: integrations/hermes/marmot/tests/test_dev_scripts.sh

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Prepare isolated Hermes dev root
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dev_root="$RUNNER_TEMP/hermes-marmot-integration"
          ./scripts/hermes_marmot_dev_setup.sh \
            --root "$dev_root" \
            --no-enable-plugin
          echo "HERMES_MARMOT_DEV_ROOT=$dev_root" >> "$GITHUB_ENV"

      - name: Run real Hermes persisted-config probe
        run: ./scripts/hermes_marmot_verify_persisted_config.sh --root "$HERMES_MARMOT_DEV_ROOT"

  openclaw-host-compat:
    name: OpenClaw beta host compatibility
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Test supported OpenClaw beta host
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          integrations/openclaw/marmot/test/openclaw-host-compat.sh

  openclaw-plugin:
    name: Package OpenClaw plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Package OpenClaw Marmot plugin tarball
        shell: bash
        run: |
          set -euo pipefail
          sha_short="${GITHUB_SHA::12}"
          workspace_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          artifact_version="$sha_short"
          release_tag=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
            if [[ ! "$release_tag" =~ ^wn-agent-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "error: wn-agent releases must use a version tag like wn-agent-v0.1.0" >&2
              exit 1
            fi
            artifact_version="${release_tag#wn-agent-v}"
            if [ "$artifact_version" != "$workspace_version" ]; then
              echo "error: release version $artifact_version does not match workspace version $workspace_version" >&2
              exit 1
            fi
          fi
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          packed_dir="$RUNNER_TEMP/openclaw-pack"
          rm -rf "$packed_dir"; mkdir -p "$packed_dir"
          # Build dist/ before packing: package.json#files ships dist (which is
          # gitignored), and the gateway requires compiled runtime output rather
          # than the TypeScript sources.
          (
            cd integrations/openclaw/marmot
            pnpm install --frozen-lockfile
            pnpm typecheck
            pnpm test
            pnpm build
          )
          # Provenance manifest (release.md requires one in each artifact); ships
          # via package.json#files alongside the built plugin.
          cat > integrations/openclaw/marmot/manifest.json <<EOF
          {
            "name": "openclaw-marmot-plugin",
            "release_tag": "$release_tag",
            "artifact_version": "$artifact_version",
            "source_sha": "$GITHUB_SHA",
            "workspace_version": "$workspace_version"
          }
          EOF
          # On a release tag, sync the tarball's package version to the cohort
          # (wn-agent / workspace version). Off-tag validation runs keep 0.1.0.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            ( cd integrations/openclaw/marmot && npm pkg set version="$artifact_version" )
          fi
          ( cd integrations/openclaw/marmot && pnpm pack --pack-destination "$packed_dir" )
          packed="$(find "$packed_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          if [ -z "$packed" ]; then
            echo "error: pnpm pack did not produce a tarball" >&2
            exit 1
          fi
          asset="$RUNNER_TEMP/openclaw-marmot-plugin-$artifact_version.tgz"
          mv "$packed" "$asset"
          shasum -a 256 "$asset" | awk -v name="$(basename "$asset")" '{print $1 "  " name}' > "$asset.sha256"
          mkdir -p dist/openclaw-marmot-plugin
          cp "$asset" "$asset.sha256" dist/openclaw-marmot-plugin/

      - name: Upload OpenClaw plugin tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openclaw-marmot-plugin
          path: dist/openclaw-marmot-plugin/*
          if-no-files-found: error

  publish:
    name: Publish wn-agent release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/wn-agent-v')
    runs-on: ubuntu-latest
    needs:
      - build
      - plugin
      - hermes-marmot-integration
      - openclaw-plugin
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist/linux dist/linux-arm dist/darwin dist/darwin-intel dist/codex-linux dist/codex-linux-arm dist/codex-darwin dist/codex-darwin-intel dist/opencode-linux dist/opencode-linux-arm dist/opencode-darwin dist/opencode-darwin-intel dist/pi-linux dist/pi-linux-arm dist/pi-darwin dist/pi-darwin-intel dist/plugin
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-agent-linux-x86_64 --dir dist/linux
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-agent-linux-aarch64 --dir dist/linux-arm
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-agent-darwin-aarch64 --dir dist/darwin
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-agent-darwin-x86_64 --dir dist/darwin-intel
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-codex-linux-x86_64 --dir dist/codex-linux
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-codex-linux-aarch64 --dir dist/codex-linux-arm
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-codex-darwin-aarch64 --dir dist/codex-darwin
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-codex-darwin-x86_64 --dir dist/codex-darwin-intel
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-opencode-linux-x86_64 --dir dist/opencode-linux
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-opencode-linux-aarch64 --dir dist/opencode-linux-arm
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-opencode-darwin-aarch64 --dir dist/opencode-darwin
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-opencode-darwin-x86_64 --dir dist/opencode-darwin-intel
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-pi-linux-x86_64 --dir dist/pi-linux
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-pi-linux-aarch64 --dir dist/pi-linux-arm
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-pi-darwin-aarch64 --dir dist/pi-darwin
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name wn-pi-darwin-x86_64 --dir dist/pi-darwin-intel
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name hermes-marmot-plugin --dir dist/plugin
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name openclaw-marmot-plugin --dir dist/plugin

      - name: Prepare versioned installer
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#wn-agent-v}"
          workspace_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ ! "$tag" =~ ^wn-agent-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: wn-agent releases must use a version tag like wn-agent-v0.1.0" >&2
            exit 1
          fi
          if [ "$version" != "$workspace_version" ]; then
            echo "error: wn-agent release version $version does not match workspace version $workspace_version" >&2
            exit 1
          fi

          mkdir -p dist/install
          sed \
            -e "s/^MARMOT_RELEASE_TAG_DEFAULT=.*/MARMOT_RELEASE_TAG_DEFAULT=\"${tag}\"/" \
            -e "s/^WN_AGENT_VERSION_DEFAULT=.*/WN_AGENT_VERSION_DEFAULT=\"${version}\"/" \
            scripts/install-hermes-marmot.sh > dist/install/install-hermes-marmot.sh
          chmod 0755 dist/install/install-hermes-marmot.sh
          sed \
            -e "s/^MARMOT_RELEASE_TAG_DEFAULT=.*/MARMOT_RELEASE_TAG_DEFAULT=\"${tag}\"/" \
            -e "s/^WN_AGENT_VERSION_DEFAULT=.*/WN_AGENT_VERSION_DEFAULT=\"${version}\"/" \
            scripts/install-openclaw-marmot.sh > dist/install/install-openclaw-marmot.sh
          chmod 0755 dist/install/install-openclaw-marmot.sh
          for harness in codex opencode pi; do
            awk -v harness="$harness" \
              'NR == 1 { print; print "export MARMOT_TERMINAL_HARNESS=" harness; next } { print }' \
              scripts/install-terminal-harness-marmot.sh | \
              sed \
                -e "s/^MARMOT_RELEASE_TAG_DEFAULT=.*/MARMOT_RELEASE_TAG_DEFAULT=\"${tag}\"/" \
                -e "s/^WN_AGENT_VERSION_DEFAULT=.*/WN_AGENT_VERSION_DEFAULT=\"${version}\"/" \
                > "dist/install/install-$harness-marmot.sh"
            chmod 0755 "dist/install/install-$harness-marmot.sh"
          done
          for installer in dist/install/install-*.sh; do
            shasum -a 256 "$installer" | \
              awk -v name="$(basename "$installer")" '{print $1 "  " name}' \
              > "$installer.sha256"
          done

      - name: Create or update wn-agent release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#wn-agent-v}"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          WN Agent \`$version\` from MDK commit \`$GITHUB_SHA\`.

          Install the latest WN Agent release with:

          \`\`\`sh
          set -eu
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/wn-agent-latest"

          install_verified() (
            set -eu
            installer_url="\$1"
            checksum_url="\$2"
            shift 2
            installer_script="\${installer_url##*/}"
            tmpdir="\$(mktemp -d)"
            trap 'rm -rf "\$tmpdir"' 0 HUP INT TERM
            curl -fsSL "\$installer_url" -o "\$tmpdir/\$installer_script"
            curl -fsSL "\$checksum_url" -o "\$tmpdir/\$installer_script.sha256"
            if command -v shasum >/dev/null 2>&1; then
              (cd "\$tmpdir" && shasum -a 256 -c "\$installer_script.sha256")
            elif command -v sha256sum >/dev/null 2>&1; then
              (cd "\$tmpdir" && sha256sum -c "\$installer_script.sha256")
            else
              echo "error: need shasum or sha256sum to verify the installer" >&2
              exit 1
            fi
            bash "\$tmpdir/\$installer_script" "\$@"
          )

          # Hermes gateway
          install_verified "\$base_url/install-hermes-marmot.sh" "\$base_url/install-hermes-marmot.sh.sha256"
          # OpenClaw gateway
          install_verified "\$base_url/install-openclaw-marmot.sh" "\$base_url/install-openclaw-marmot.sh.sha256"
          # Codex terminal harness
          install_verified "\$base_url/install-codex-marmot.sh" "\$base_url/install-codex-marmot.sh.sha256"
          # OpenCode terminal harness
          install_verified "\$base_url/install-opencode-marmot.sh" "\$base_url/install-opencode-marmot.sh.sha256"
          # Pi terminal harness
          install_verified "\$base_url/install-pi-marmot.sh" "\$base_url/install-pi-marmot.sh.sha256"
          \`\`\`

          Install this exact WN Agent release with:

          \`\`\`sh
          set -eu
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"

          install_verified() (
            set -eu
            installer_url="\$1"
            checksum_url="\$2"
            shift 2
            installer_script="\${installer_url##*/}"
            tmpdir="\$(mktemp -d)"
            trap 'rm -rf "\$tmpdir"' 0 HUP INT TERM
            curl -fsSL "\$installer_url" -o "\$tmpdir/\$installer_script"
            curl -fsSL "\$checksum_url" -o "\$tmpdir/\$installer_script.sha256"
            if command -v shasum >/dev/null 2>&1; then
              (cd "\$tmpdir" && shasum -a 256 -c "\$installer_script.sha256")
            elif command -v sha256sum >/dev/null 2>&1; then
              (cd "\$tmpdir" && sha256sum -c "\$installer_script.sha256")
            else
              echo "error: need shasum or sha256sum to verify the installer" >&2
              exit 1
            fi
            bash "\$tmpdir/\$installer_script" "\$@"
          )

          # Hermes gateway
          install_verified "\$base_url/install-hermes-marmot.sh" "\$base_url/install-hermes-marmot.sh.sha256"
          # OpenClaw gateway
          install_verified "\$base_url/install-openclaw-marmot.sh" "\$base_url/install-openclaw-marmot.sh.sha256"
          # Codex terminal harness
          install_verified "\$base_url/install-codex-marmot.sh" "\$base_url/install-codex-marmot.sh.sha256"
          # OpenCode terminal harness
          install_verified "\$base_url/install-opencode-marmot.sh" "\$base_url/install-opencode-marmot.sh.sha256"
          # Pi terminal harness
          install_verified "\$base_url/install-pi-marmot.sh" "\$base_url/install-pi-marmot.sh.sha256"
          \`\`\`

          Assets:
          - \`wn-agent-<platform>-$version.tar.gz\`: versioned binary bundle.
          - \`wn-codex-<platform>-$version.tar.gz\`: Codex harness binary bundle.
          - \`wn-opencode-<platform>-$version.tar.gz\`: OpenCode harness binary bundle.
          - \`wn-pi-<platform>-$version.tar.gz\`: Pi harness binary bundle.
          - \`hermes-marmot-plugin-$version.tar.gz\`: Hermes platform plugin directory bundle.
          - \`openclaw-marmot-plugin-$version.tgz\`: OpenClaw channel plugin npm tarball.
          - \`install-hermes-marmot.sh\`: installer for testers with Hermes already installed.
          - \`install-openclaw-marmot.sh\`: installer for testers with OpenClaw already installed.
          - \`install-codex-marmot.sh\`: installer for testers with Codex already installed.
          - \`install-opencode-marmot.sh\`: installer for testers with OpenCode already installed.
          - \`install-pi-marmot.sh\`: installer for testers with Pi already installed.

          Verify downloads with the accompanying \`.sha256\` files.
          EOF

          assets=(
            dist/linux/wn-agent-linux-x86_64-"$version".tar.gz
            dist/linux/wn-agent-linux-x86_64-"$version".tar.gz.sha256
            dist/linux-arm/wn-agent-linux-aarch64-"$version".tar.gz
            dist/linux-arm/wn-agent-linux-aarch64-"$version".tar.gz.sha256
            dist/darwin/wn-agent-darwin-aarch64-"$version".tar.gz
            dist/darwin/wn-agent-darwin-aarch64-"$version".tar.gz.sha256
            dist/darwin-intel/wn-agent-darwin-x86_64-"$version".tar.gz
            dist/darwin-intel/wn-agent-darwin-x86_64-"$version".tar.gz.sha256
            dist/codex-linux/wn-codex-linux-x86_64-"$version".tar.gz
            dist/codex-linux/wn-codex-linux-x86_64-"$version".tar.gz.sha256
            dist/codex-linux-arm/wn-codex-linux-aarch64-"$version".tar.gz
            dist/codex-linux-arm/wn-codex-linux-aarch64-"$version".tar.gz.sha256
            dist/codex-darwin/wn-codex-darwin-aarch64-"$version".tar.gz
            dist/codex-darwin/wn-codex-darwin-aarch64-"$version".tar.gz.sha256
            dist/codex-darwin-intel/wn-codex-darwin-x86_64-"$version".tar.gz
            dist/codex-darwin-intel/wn-codex-darwin-x86_64-"$version".tar.gz.sha256
            dist/opencode-linux/wn-opencode-linux-x86_64-"$version".tar.gz
            dist/opencode-linux/wn-opencode-linux-x86_64-"$version".tar.gz.sha256
            dist/opencode-linux-arm/wn-opencode-linux-aarch64-"$version".tar.gz
            dist/opencode-linux-arm/wn-opencode-linux-aarch64-"$version".tar.gz.sha256
            dist/opencode-darwin/wn-opencode-darwin-aarch64-"$version".tar.gz
            dist/opencode-darwin/wn-opencode-darwin-aarch64-"$version".tar.gz.sha256
            dist/opencode-darwin-intel/wn-opencode-darwin-x86_64-"$version".tar.gz
            dist/opencode-darwin-intel/wn-opencode-darwin-x86_64-"$version".tar.gz.sha256
            dist/pi-linux/wn-pi-linux-x86_64-"$version".tar.gz
            dist/pi-linux/wn-pi-linux-x86_64-"$version".tar.gz.sha256
            dist/pi-linux-arm/wn-pi-linux-aarch64-"$version".tar.gz
            dist/pi-linux-arm/wn-pi-linux-aarch64-"$version".tar.gz.sha256
            dist/pi-darwin/wn-pi-darwin-aarch64-"$version".tar.gz
            dist/pi-darwin/wn-pi-darwin-aarch64-"$version".tar.gz.sha256
            dist/pi-darwin-intel/wn-pi-darwin-x86_64-"$version".tar.gz
            dist/pi-darwin-intel/wn-pi-darwin-x86_64-"$version".tar.gz.sha256
            dist/plugin/hermes-marmot-plugin-"$version".tar.gz
            dist/plugin/hermes-marmot-plugin-"$version".tar.gz.sha256
            dist/plugin/openclaw-marmot-plugin-"$version".tgz
            dist/plugin/openclaw-marmot-plugin-"$version".tgz.sha256
            dist/install/install-hermes-marmot.sh
            dist/install/install-hermes-marmot.sh.sha256
            dist/install/install-openclaw-marmot.sh
            dist/install/install-openclaw-marmot.sh.sha256
            dist/install/install-codex-marmot.sh
            dist/install/install-codex-marmot.sh.sha256
            dist/install/install-opencode-marmot.sh
            dist/install/install-opencode-marmot.sh.sha256
            dist/install/install-pi-marmot.sh
            dist/install/install-pi-marmot.sh.sha256
          )

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "v$version - wn-agent" --notes-file "$notes" --prerelease
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "v$version - wn-agent" \
              --notes-file "$notes" \
              --prerelease
          fi

      - name: Create or update latest installer release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#wn-agent-v}"
          latest_tag="wn-agent-latest"
          latest_notes="$RUNNER_TEMP/latest-installer-release-notes.md"

          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "true" ]; then
            echo "versioned release $tag is still draft; leaving $latest_tag unchanged"
            exit 0
          fi

          latest_release_file="$RUNNER_TEMP/latest-installer-release.json"
          if ! latest_status="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$latest_release_file" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$latest_tag")"; then
            if [ "$latest_status" != "404" ]; then
              echo "failed to inspect $latest_tag; refusing to mutate the legacy installer alias" >&2
              exit 1
            fi
          fi

          if [ "$latest_status" = "200" ]; then
            if ! latest_immutable="$(jq -er \
              'if (.immutable | type) == "boolean" then .immutable else error("missing boolean immutable field") end' \
              "$latest_release_file")"; then
              echo "invalid release metadata for $latest_tag; refusing to mutate the legacy installer alias" >&2
              exit 1
            fi
          elif [ "$latest_status" = "404" ]; then
            latest_immutable="false"
          else
            echo "unexpected HTTP status $latest_status while inspecting $latest_tag; refusing to mutate the legacy installer alias" >&2
            exit 1
          fi

          if [ "$latest_immutable" = "true" ]; then
            echo "warning: $latest_tag is immutable; leaving the legacy installer alias unchanged"
            echo "use the installer assets from the immutable $tag release instead"
            exit 0
          fi

          cat > "$latest_notes" <<EOF
          Latest WN Agent installers. These scripts install whichever version the mutable \`$latest_tag\` alias currently references; use immutable release \`$tag\` for WN Agent \`$version\`.

          \`\`\`sh
          set -eu
          base_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$latest_tag"

          install_verified() (
            set -eu
            installer_url="\$1"
            checksum_url="\$2"
            shift 2
            installer_script="\${installer_url##*/}"
            tmpdir="\$(mktemp -d)"
            trap 'rm -rf "\$tmpdir"' 0 HUP INT TERM
            curl -fsSL "\$installer_url" -o "\$tmpdir/\$installer_script"
            curl -fsSL "\$checksum_url" -o "\$tmpdir/\$installer_script.sha256"
            if command -v shasum >/dev/null 2>&1; then
              (cd "\$tmpdir" && shasum -a 256 -c "\$installer_script.sha256")
            elif command -v sha256sum >/dev/null 2>&1; then
              (cd "\$tmpdir" && sha256sum -c "\$installer_script.sha256")
            else
              echo "error: need shasum or sha256sum to verify the installer" >&2
              exit 1
            fi
            bash "\$tmpdir/\$installer_script" "\$@"
          )

          # Hermes gateway
          install_verified "\$base_url/install-hermes-marmot.sh" "\$base_url/install-hermes-marmot.sh.sha256"
          # OpenClaw gateway
          install_verified "\$base_url/install-openclaw-marmot.sh" "\$base_url/install-openclaw-marmot.sh.sha256"
          # Codex terminal harness
          install_verified "\$base_url/install-codex-marmot.sh" "\$base_url/install-codex-marmot.sh.sha256"
          # OpenCode terminal harness
          install_verified "\$base_url/install-opencode-marmot.sh" "\$base_url/install-opencode-marmot.sh.sha256"
          # Pi terminal harness
          install_verified "\$base_url/install-pi-marmot.sh" "\$base_url/install-pi-marmot.sh.sha256"
          \`\`\`

          Use the versioned \`$tag\` release URLs when you need a pinned install.
          EOF

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$latest_tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$latest_tag" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$latest_tag" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          assets=(
            dist/install/install-hermes-marmot.sh
            dist/install/install-hermes-marmot.sh.sha256
            dist/install/install-openclaw-marmot.sh
            dist/install/install-openclaw-marmot.sh.sha256
            dist/install/install-codex-marmot.sh
            dist/install/install-codex-marmot.sh.sha256
            dist/install/install-opencode-marmot.sh
            dist/install/install-opencode-marmot.sh.sha256
            dist/install/install-pi-marmot.sh
            dist/install/install-pi-marmot.sh.sha256
          )

          if gh release view "$latest_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$latest_tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$latest_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest WN Agent installers" \
              --notes-file "$latest_notes" \
              --prerelease \
              --latest=false
          else
            gh release create "$latest_tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest WN Agent installers" \
              --notes-file "$latest_notes" \
              --prerelease \
              --latest=false
          fi
