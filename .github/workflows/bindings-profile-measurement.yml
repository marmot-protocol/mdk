name: MarmotKit Release Profile Measurements

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase 40-character SHA to compare
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marmotkit-profile-measurement-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  MACOSX_DEPLOYMENT_TARGET: "15.0"
  ANDROID_NDK_VERSION: 27.2.12479018
  OTLP_EXPORT: "1"
  PRODUCT_ANALYTICS_EXPORT: "1"

jobs:
  identity:
    name: Resolve selected measurement SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - name: Check out selected SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Fail closed unless checkout matches the full SHA
        id: identity
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: source_sha must be a full lowercase 40-character SHA" >&2
            exit 1
          fi
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$source_sha" != "$REQUESTED_SHA" ]]; then
            echo "error: selected SHA resolved to unexpected commit $source_sha" >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  linux-measurement:
    name: Compare host, Android, and CPU profiles
    runs-on: ubuntu-latest
    needs: identity
    timeout-minutes: 240
    steps:
      - name: Check out selected SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.source_sha }}
      - name: Install Rust toolchain and Android targets
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustc --version
          cargo --version
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "error: ANDROID_SDK_ROOT or ANDROID_HOME must be set on the runner" >&2
            exit 1
          fi
          sdkmanager_bin=""
          for candidate in \
            "$sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "$sdk_root/cmdline-tools/bin/sdkmanager" \
            "$sdk_root/tools/bin/sdkmanager"; do
            if [[ -x "$candidate" ]]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [[ -z "$sdkmanager_bin" ]] && command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager_bin="$(command -v sdkmanager)"
          fi
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "error: sdkmanager not found under $sdk_root" >&2
            find "$sdk_root" -maxdepth 4 -type f -name sdkmanager -print >&2 || true
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_bin" "ndk;$ANDROID_NDK_VERSION"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Compare host, Android ABIs, and CPU
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/marmotkit-profile-measurement"
          python3 crates/marmot-uniffi/measure-release-profile.py \
            --source-sha "$SOURCE_SHA" \
            --builder-sha "$SOURCE_SHA" \
            --host --android --cpu \
            --require-android-reduction \
            --work-dir target/release-profile-measure \
            --diagnostics-dir "$RUNNER_TEMP/marmotkit-profile-measurement/diagnostics" \
            --output "$RUNNER_TEMP/marmotkit-profile-measurement/release-profile-measurements.json" \
            --markdown "$RUNNER_TEMP/marmotkit-profile-measurement/release-profile-measurements.md"
      - name: Collect Linux measurement diagnostics
        if: always()
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/marmotkit-profile-measurement/diagnostics"
          mkdir -p "$out"
          if [[ -d target/release-profile-measure/logs ]]; then
            cp -a target/release-profile-measure/logs "$out/logs"
          fi
          for variant in baseline candidate; do
            if [[ -d "target/release-profile-measure/cpu-${variant}/criterion" ]]; then
              mkdir -p "$out/cpu-${variant}"
              cp -a "target/release-profile-measure/cpu-${variant}/criterion" "$out/cpu-${variant}/criterion"
            fi
          done
          {
            echo "source_sha=$SOURCE_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            rustc --version || true
            cargo --version || true
          } > "$out/toolchain.txt"
      - name: Upload Linux comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-measurement-linux-${{ needs.identity.outputs.source_sha }}
          path: ${{ runner.temp }}/marmotkit-profile-measurement
          if-no-files-found: error
          retention-days: 14
      - name: Write Linux comparison summary
        if: always()
        run: |
          report="$RUNNER_TEMP/marmotkit-profile-measurement/release-profile-measurements.md"
          if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

  apple-measurement:
    name: Compare Apple archive profiles
    runs-on: macos-latest
    needs: identity
    timeout-minutes: 240
    steps:
      - name: Check out selected SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.identity.outputs.source_sha }}
      - name: Install Rust toolchain and Apple targets
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin
          rustc --version
          cargo --version
          xcodebuild -version
      - name: Compare Apple archive slices
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/marmotkit-profile-measurement"
          python3 crates/marmot-uniffi/measure-release-profile.py \
            --source-sha "$SOURCE_SHA" \
            --builder-sha "$SOURCE_SHA" \
            --apple \
            --work-dir target/release-profile-measure \
            --diagnostics-dir "$RUNNER_TEMP/marmotkit-profile-measurement/diagnostics" \
            --output "$RUNNER_TEMP/marmotkit-profile-measurement/release-profile-measurements.json" \
            --markdown "$RUNNER_TEMP/marmotkit-profile-measurement/release-profile-measurements.md"
      - name: Collect Apple measurement diagnostics
        if: always()
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/marmotkit-profile-measurement/diagnostics"
          mkdir -p "$out"
          if [[ -d target/release-profile-measure/logs ]]; then
            cp -a target/release-profile-measure/logs "$out/logs"
          fi
          {
            echo "source_sha=$SOURCE_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            rustc --version || true
            cargo --version || true
            xcodebuild -version || true
          } > "$out/toolchain.txt"
      - name: Upload Apple comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmotkit-profile-measurement-apple-${{ needs.identity.outputs.source_sha }}
          path: ${{ runner.temp }}/marmotkit-profile-measurement
          if-no-files-found: error
          retention-days: 14
      - name: Write Apple comparison summary
        if: always()
        run: |
          report="$RUNNER_TEMP/marmotkit-profile-measurement/release-profile-measurements.md"
          if [[ -f "$report" ]]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

  measurement-complete:
    name: MarmotKit comparative evidence complete
    runs-on: ubuntu-latest
    needs: [identity, linux-measurement, apple-measurement]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every measurement surface
        env:
          IDENTITY_RESULT: ${{ needs.identity.result }}
          LINUX_RESULT: ${{ needs.linux-measurement.result }}
          APPLE_RESULT: ${{ needs.apple-measurement.result }}
        run: |
          set -euo pipefail
          [[ "$IDENTITY_RESULT" == success ]]
          [[ "$LINUX_RESULT" == success ]]
          [[ "$APPLE_RESULT" == success ]]
