name: Marmot C Bindings

on:
  push:
    tags:
      - marmotc-v*
      # RC and legacy nightly tags are created by rc-releases.yml, which calls this workflow itself.
      - "!marmotc-v*-nightly.*"
      - "!marmotc-v*-rc.*"
  workflow_call:
    secrets:
      stage_token:
        description: Token that stages the release draft (RC and Stable callers pass secrets.RELEASE_TOKEN; the workflow token is refused there). Named so no repo secret matches it, so tag-push and dispatch runs keep the workflow token
        required: false
    inputs:
      source_sha:
        description: Full 40-character source SHA on master (or verified metadata-only release commit)
        required: true
        type: string
      build_only:
        description: Build and smoke-test the bundle without staging a release
        required: false
        default: false
        type: boolean
      release_version:
        description: SemVer RC (X.Y.Z-rc.N) or promoted Stable (X.Y.Z); stages a draft for rc-releases.yml or promote-release.yml to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marmot-c-bindings-${{ inputs.release_version || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  linux-bindings:
    name: Build Linux C bindings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_version: ${{ steps.identity.outputs.release_version }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      is_rc: ${{ steps.identity.outputs.is_rc }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # Empty for tag pushes, which build the tagged commit.
          ref: ${{ inputs.source_sha }}

      - name: Check out workflow verification scripts
        if: ${{ !!inputs.release_version }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: builder

      - name: Validate release tag
        id: identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          set -euo pipefail
          workspace_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          is_rc=false
          if [[ -n "$RELEASE_VERSION" ]]; then
            if [[ "$BUILD_ONLY" != true && "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "error: RC/promoted publishing must run with the workflow from refs/heads/master" >&2
              exit 1
            fi
            if [[ "$source_sha" != "$REQUESTED_SHA" ]]; then
              echo "error: release source must be the requested SHA $REQUESTED_SHA, got $source_sha" >&2
              exit 1
            fi
            git fetch --no-tags origin master
            version_kind="$(python3 builder/scripts/rc_release.py check-version \
              --release-version "$RELEASE_VERSION" \
              --workspace-version "$workspace_version")"
            if [[ "$version_kind" == "rc" ]]; then
              if ! git merge-base --is-ancestor "$source_sha" origin/master; then
                echo "error: RC SHA must be reachable from origin/master" >&2
                exit 1
              fi
              is_rc=true
            else
              if ! git merge-base --is-ancestor "$source_sha" origin/master; then
                parent_sha="$(git rev-parse "${source_sha}^1")"
                if ! git merge-base --is-ancestor "$parent_sha" origin/master; then
                  echo "error: promoted commit parent $parent_sha is not reachable from origin/master" >&2
                  exit 1
                fi
                python3 builder/scripts/promote_release.py verify-metadata-diff \
                  --root . --base "$parent_sha" --head "$source_sha"
              fi
              is_rc=false
            fi
            tag="marmotc-v$RELEASE_VERSION"
            tag_version="$RELEASE_VERSION"
          else
            if [[ ! "$GITHUB_REF_NAME" =~ ^marmotc-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "error: C binding releases must use a version tag like marmotc-v0.1.0" >&2
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
            tag_version="${GITHUB_REF_NAME#marmotc-v}"
            if [[ "$tag_version" != "$workspace_version" ]]; then
              echo "error: tag version $tag_version does not match workspace version $workspace_version" >&2
              exit 1
            fi
          fi
          {
            echo "release_tag=$tag"
            echo "release_version=$tag_version"
            echo "source_sha=$source_sha"
            echo "is_rc=$is_rc"
          } >> "$GITHUB_OUTPUT"

      - name: Install pinned Odin
        uses: ./.github/actions/setup-odin

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install

      # No Cargo cache on this tag-triggered path: these artifacts are
      # published to a public GitHub Release, so they are built from a clean
      # target directory rather than from a restorable (poisonable) cache.

      - name: Install cbindgen
        uses: taiki-e/install-action@b18fb392e1a1b90971f7c7572c92790fa54f23d5
        with:
          tool: cbindgen@0.29.4

      - name: Build C bindings
        shell: bash
        run: ./crates/marmot-c/c-bindings.sh

      - name: Smoke-test against gcc and clang
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y valgrind
          ./crates/marmot-c/c-smoke.sh gcc clang

      - name: Package bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.identity.outputs.release_version }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="$RELEASE_VERSION"
          workspace_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          lock_sha="$(sha256sum Cargo.lock | awk '{print $1}')"

          stage_parent="build/marmot-c-stage"
          stage="$stage_parent/marmot-c-$version"
          asset="marmot-c-linux-x86_64-$version.zip"
          rm -rf "$stage_parent" "$asset" "$asset.sha256"
          mkdir -p "$stage" dist

          cp -R crates/marmot-c/output/. "$stage/"
          cp crates/marmot-c/README.md "$stage/"

          # Keep links between bundle files relative. Link everything else to the source revision.
          python3 - "$stage" <<'PY'
          import os
          import posixpath
          import re
          import sys
          from pathlib import Path

          stage = Path(sys.argv[1])
          repo = f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}'
          sha = os.environ["SOURCE_SHA"]
          readme = stage / "README.md"
          sources = {readme: "crates/marmot-c"}
          for reference in sorted((stage / "references").glob("*/API-REFERENCE.md")):
              sources[reference] = f"crates/{reference.parent.name}"
          readme_references = {
              "API-GUIDE.md": "references/marmot-c/API-REFERENCE.md",
              "../marmot-uniffi/API-GUIDE.md": "references/marmot-uniffi/API-REFERENCE.md",
          }

          for document, source_dir in sources.items():
              def rebase(match):
                  path, anchor = match[1], match[2] or ""
                  if document == readme and path in readme_references:
                      return f"]({readme_references[path]}{anchor})"
                  if source_dir == "crates/marmot-c" and path == "README.md" and document != readme:
                      return f"](../../README.md{anchor})"
                  if path.startswith("/") or (document.parent / path).is_file():
                      return match[0]
                  source = posixpath.normpath(f"{source_dir}/{path}")
                  kind = "tree" if path.endswith("/") else "blob"
                  return f"]({repo}/{kind}/{sha}/{source}{anchor})"

              text = document.read_text()
              document.write_text(re.sub(r"\]\(([^)#:\s]+)(#[^)\s]*)?\)", rebase, text))
          PY

          cat > "$stage/manifest.json" <<EOF
          {
            "artifact": "marmot-c",
            "version": "$version",
            "release_tag": "$tag",
            "workspace_version": "$workspace_version",
            "cargo_lock_sha256": "$lock_sha",
            "commit": "$SOURCE_SHA",
            "target": "x86_64-unknown-linux-gnu"
          }
          EOF

          (cd "$stage_parent" && zip -r "../../$asset" "marmot-c-$version")
          if [[ -f crates/marmot-c/API-GUIDE.md ]]; then
            python3 scripts/check_binding_docs.py --c-bundle "$asset"
          fi
          sha256sum "$asset" | awk -v name="$asset" '{print $1 "  " name}' > "$asset.sha256"
          cp "$asset" "$asset.sha256" dist/

      - name: Upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: marmot-c-linux
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: ${{ !inputs.build_only }}
    runs-on: ubuntu-latest
    needs:
      - linux-bindings
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download binding artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name marmot-c-linux --dir dist

      - name: Create or update release
        if: ${{ !inputs.release_version }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#marmotc-v}"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Marmot C bindings generated from MDK commit \`$GITHUB_SHA\`.

          Assets:
          - \`marmot-c-linux-x86_64-$version.zip\`: \`libmarmot_c.so\` + \`libmarmot_c.a\`, \`marmot.h\`, pkg-config file, C and UniFFI API references, README.

          Verify downloads with the accompanying \`.sha256\` files.
          EOF

          assets=(
            "dist/marmot-c-linux-x86_64-$version.zip"
            "dist/marmot-c-linux-x86_64-$version.zip.sha256"
          )

          if release_state="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_state" == "false" ]]; then
              echo "Release $tag is already published; skipping tag-push upload"
              exit 0
            fi
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "v$version - Marmot C" --notes-file "$notes"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$version - Marmot C" \
              --notes-file "$notes"
          fi

      - name: Check out workflow scripts
        if: ${{ !!inputs.release_version }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: builder

      - name: Stage release draft
        if: ${{ !!inputs.release_version }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.stage_token || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.linux-bindings.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.linux-bindings.outputs.release_version }}
          SOURCE_SHA: ${{ needs.linux-bindings.outputs.source_sha }}
          IS_RC: ${{ needs.linux-bindings.outputs.is_rc }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          asset="dist/marmot-c-linux-x86_64-$version.zip"
          (cd dist && sha256sum -c "marmot-c-linux-x86_64-$version.zip.sha256")
          unzip -p "$asset" "marmot-c-$version/manifest.json" | python3 -c '
          import json, os, sys
          manifest = json.load(sys.stdin)
          expected = {"version": os.environ["RELEASE_VERSION"], "release_tag": os.environ["RELEASE_TAG"],
                      "commit": os.environ["SOURCE_SHA"]}
          wrong = {key: manifest.get(key) for key, value in expected.items() if manifest.get(key) != value}
          if wrong:
              sys.exit(f"error: Marmot C manifest does not match release: {wrong}")
          '
          stage_notes="$RUNNER_TEMP/stage-notes.md"
          : > "$stage_notes"
          stage_args=(--stable)
          if [[ "$IS_RC" == "true" ]]; then
            printf '%s\n\n' 'SemVer Release Candidate for staging and integration testing. Pin a formal `marmotc-v<version>` release for production.' > "$stage_notes"
            stage_args=()
          fi
          members="$(unzip -Z1 "$asset")"
          references=""
          if grep -Fxq "marmot-c-$version/references/marmot-c/API-REFERENCE.md" <<< "$members" &&
             grep -Fxq "marmot-c-$version/references/marmot-uniffi/API-REFERENCE.md" <<< "$members"; then
            references=', C and UniFFI API references'
          fi
          cat >> "$stage_notes" <<EOF
          Marmot C bindings generated from exact MDK commit \`$SOURCE_SHA\`.

          Assets:
          - \`marmot-c-linux-x86_64-$version.zip\`: \`libmarmot_c.so\` + \`libmarmot_c.a\`, \`marmot.h\`, pkg-config file, README$references.

          Verify downloads with the accompanying \`.sha256\` files.
          EOF
          python3 builder/scripts/rc_release.py stage-draft \
            --tag "$RELEASE_TAG" \
            --title "v$version - Marmot C" \
            --target "$SOURCE_SHA" \
            --notes-file "$stage_notes" \
            "${stage_args[@]}" \
            "$asset" "$asset.sha256"
