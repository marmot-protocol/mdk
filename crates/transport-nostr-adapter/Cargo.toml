[package]
name = "transport-nostr-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Nostr transport adapter for Marmot CGKA transport messages."

[features]
default = []
sdk = ["dep:nostr-sdk"]
# Aggregate comparison-branch evidence for app recovery fixtures only.
test-policy-overrides = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
cgka-traits.workspace = true
futures.workspace = true
hex.workspace = true
nostr.workspace = true
nostr-sdk = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
transport-nostr-peeler.workspace = true

[dev-dependencies]
nostr-memory = { git = "https://github.com/erskingardner/rust-nostr", rev = "63384e485d55097cb3d9e57a2146f453a5742570" }
nostr-relay-builder.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }
tokio-tungstenite = "0.26"
