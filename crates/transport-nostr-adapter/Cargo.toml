[package]
name = "transport-nostr-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Nostr transport adapter for Marmot CGKA transport messages."

[features]
default = []
sdk = ["dep:nostr-gossip", "dep:nostr-sdk", "dep:async-wsocket", "dep:tokio-socks", "dep:tokio-tungstenite", "dep:zeroize"]
# Device pairing's Nostr events (#2628). Unreleased until the pairing spec
# merges: nothing enables it, so no release sends pairing messages.
unreleased-device-pairing = ["dep:marmot-pairing"]

[dependencies]
async-trait.workspace = true
async-wsocket = { workspace = true, optional = true }
base64.workspace = true
cgka-traits.workspace = true
futures.workspace = true
hex.workspace = true
marmot-pairing = { workspace = true, optional = true }
nostr.workspace = true
nostr-gossip = { workspace = true, optional = true }
nostr-sdk = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-socks = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util.workspace = true
tracing.workspace = true
transport-nostr-peeler.workspace = true
zeroize = { workspace = true, optional = true }

[dev-dependencies]
marmot-pairing.workspace = true
nostr-memory = { git = "https://github.com/erskingardner/rust-nostr", rev = "48801bf6f2f1cd55bb1729e94159946c8832a786" }
nostr-relay-builder.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }
