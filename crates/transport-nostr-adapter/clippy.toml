# Every relay client must follow the process SOCKS5 policy.
# Build them through `crate::network_proxy` instead.
disallowed-methods = [
    { path = "nostr_sdk::client::Client::builder", reason = "use crate::network_proxy::nostr_builder()" },
    { path = "nostr_sdk::client::Client::new", reason = "use crate::network_proxy::nostr_builder()" },
    { path = "nostr_sdk::client::ClientBuilder::new", reason = "use crate::network_proxy::nostr_builder()" },
]
