[package]
name = "nostr-directory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Directory of other people's public Nostr data for Marmot: lookups, search, KeyPackage resolution and the per-account cache schema, reaching the host app only through traits."

[dependencies]
base64.workspace = true
cgka-engine.workspace = true
cgka-traits.workspace = true
fs-private.workspace = true
futures.workspace = true
hex.workspace = true
nostr = { workspace = true, features = ["nip04"] }
nostr-sdk.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
storage-sqlite.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "net", "io-util"] }
tracing.workspace = true
transport-nostr.workspace = true
transport-nostr-adapter = { workspace = true, features = ["sdk"] }
transport-nostr-peeler.workspace = true
url.workspace = true

[dev-dependencies]
storage-sqlite = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
# Inert test hooks for dependents' tests: the directory internals that
# marmot-app's directory tests read. Nothing happens unless a test calls one;
# release builds never enable it.
test-support = []
