language = "C"
pragma_once = true
include_version = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
header = """/*
 * marmot.h — C ABI for the Marmot app runtime.
 *
 * Generated by cbindgen from crates/marmot-c; do not edit by hand.
 * Regenerate with `just c-header`.
 *
 * Ownership rules:
 *  - Fallible functions return MarmotStatus; MARMOT_STATUS_OK is 0.
 *    Detail text for the calling thread's most recent failure comes from
 *    marmot_last_error_message() (free with marmot_string_free).
 *  - Structs returned by pointer are freed ONLY with their matching
 *    marmot_*_free function, which deep-frees every field. Never free
 *    fields individually and never free a struct twice.
 *  - Input structs and strings are borrowed: the library never frees or
 *    retains caller memory.
 *  - Values the caller supplies are fixed-width integers, never enum or
 *    bool types: booleans are uint8_t (nonzero is true) and enums are
 *    uint32_t discriminants, validated on entry (out of range =>
 *    MARMOT_STATUS_INVALID_ARGUMENT). Passing an out-of-range value in a
 *    C enum or _Bool would be undefined behavior before any check runs.
 *  - Required out-pointers are validated and cleared before the call does
 *    any work, so a rejected call never leaves a side effect behind.
 *  - Callbacks run on runtime worker threads; item pointers passed to a
 *    callback are borrowed and valid only for the duration of the call.
 */"""

[export]
prefix = ""
# Enums a caller passes as a uint32_t discriminant are no longer referenced
# by any signature, so cbindgen would drop the constants consumers need.
include = ["MarmotNotificationWakeSource"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[parse]
parse_deps = false

[parse.expand]
# The mirror surface is macro-generated (src/macros.rs); expansion needs
# RUSTC_BOOTSTRAP=1 on stable (set by `just c-header`).
crates = ["marmot-c"]
