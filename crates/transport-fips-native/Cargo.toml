[package]
name = "transport-fips-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native FIPS transport for Nostr-shaped Marmot relay traffic."

[dependencies]
async-trait.workspace = true
hex.workspace = true
nostr.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
transport-nostr-adapter.workspace = true
transport-nostr-peeler.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "macos"))'.dependencies]
# WFP1's shared codec is pinned to the exact Wok interoperability revision.
fips-message = { git = "https://github.com/erskingardner/wok.git", rev = "957d22c296e8053c7d01c80f15a3ae9b2b5f2fca" }
fips = { git = "https://github.com/jmcorgan/fips.git", rev = "1ec62e51192a3ed49792e177c8c88d8176647133" }
libc.workspace = true
rand.workspace = true

[dev-dependencies]
nostr.workspace = true
nostr-sdk.workspace = true
tokio = { workspace = true, features = ["test-util"] }
