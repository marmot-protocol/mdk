[package]
name = "wn-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[features]
product-analytics-export = ["marmot-app/product-analytics-export"]
default = []
otlp-export = ["marmot-app/otlp-export"]
test-policy-overrides = ["marmot-app/test-policy-overrides"]

[[bin]]
name = "wn"
path = "src/main.rs"

[[bin]]
name = "wnd"
path = "src/bin/wnd.rs"

[dependencies]
cgka-traits.workspace = true
chrono.workspace = true
clap.workspace = true
fs-private.workspace = true
hex.workspace = true
libc.workspace = true
marmot-account.workspace = true
marmot-app.workspace = true
nostr.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread", "signal"] }
unicode-properties.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
marmot-app = { workspace = true, features = ["test-support"] }
nostr-relay-builder.workspace = true
nostr-sdk.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
