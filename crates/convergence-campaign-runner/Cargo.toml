[package]
name = "convergence-campaign-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Container-first and VM-delegating distributed convergence campaign runner."

[[bin]]
name = "cgka-distributed-campaign"
path = "src/main.rs"

[[bin]]
name = "cgka-conformance-node"
path = "src/bin/cgka-conformance-node.rs"

[[bin]]
name = "cgka-conformance-relay"
path = "src/bin/cgka-conformance-relay.rs"

[dependencies]
cgka-conformance-simulator.workspace = true
async-trait.workspace = true
clap.workspace = true
fs-private.workspace = true
hex.workspace = true
libc.workspace = true
nostr-relay-builder.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
