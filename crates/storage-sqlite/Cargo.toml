[package]
name = "storage-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SQLite storage backend for the CGKA engine with Marmot and OpenMLS state in one database."

[dependencies]
cgka-traits.workspace = true
fs-private.workspace = true
hex.workspace = true
libc = { workspace = true, optional = true }
media-store.workspace = true
openmls.workspace = true
openmls_traits.workspace = true
rmp-serde = "1.3.1"
rusqlite = { workspace = true, features = ["blob", "hooks"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The migrated test template is copied with SQLite's backup API.
rusqlite = { workspace = true, features = ["backup"] }
media-store = { workspace = true, features = ["catalog-conformance"] }
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, features = ["visit"] }
tempfile.workspace = true
tracing-subscriber.workspace = true

[features]
extensions-draft = ["openmls_traits/extensions-draft"]
storage-format-benchmarks = []
# Media file store benchmark (mdk#2314 step 0): `media_store_bench` (the
# `media-store` format against the SQLCipher retained-attachment path) and the
# `media_store_bench` example, run on desktop and on devices.
media-store-benchmarks = ["dep:libc"]
test-conformance-replay = []
# Test-only hooks for dependents' tests: database page caps, checkpoint byte
# counts, stores that skip SQLCipher's memory security and full fsync, and
# in-memory stores copied from a migrated template. The hooks are inert
# helpers: nothing happens unless a test calls one, and non-test code must
# never call them. Workspace-wide `--all-targets` dev builds enable this
# feature through marmot-app's dev-dependency, and the conformance simulator
# enables it; release and artifact recipes build single packages without
# dev-dependencies, so it is never compiled into them.
test-support = ["rusqlite/backup"]

[[example]]
name = "media_store_bench"
required-features = ["media-store-benchmarks"]
