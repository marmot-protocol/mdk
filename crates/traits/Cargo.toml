[package]
name = "cgka-traits"
# Workspace dep key is `cgka-traits`; code uses `cgka_traits::...`.
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared traits and cross-boundary value types for the CGKA engine, TransportAdapter, TransportPeeler, and storage backends."

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
serde = { workspace = true }
serde_json.workspace = true
hex.workspace = true
url.workspace = true
openmls_traits.workspace = true
rand.workspace = true
sha2.workspace = true
web-time.workspace = true
zeroize.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion.workspace = true
insta.workspace = true

[[bench]]
name = "stored_message_codec"
harness = false
