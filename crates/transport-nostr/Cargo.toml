[package]
name = "transport-nostr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Marmot's Nostr relay plane: per-account relay sessions, delivery, publish accounting, directory fetches and relay safety."

[features]
default = []
# Test hooks and accessors for crates that drive the plane in their own tests
# (marmot-app enables it through its dev-dependency). Never enable in app
# artifacts.
test-support = []

[dependencies]
async-trait.workspace = true
cgka-traits.workspace = true
futures.workspace = true
hex.workspace = true
nostr.workspace = true
nostr-sdk.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
transport-nostr-adapter = { workspace = true, features = ["sdk"] }
transport-nostr-peeler.workspace = true
url.workspace = true

[dev-dependencies]
nostr-relay-builder.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite.workspace = true
